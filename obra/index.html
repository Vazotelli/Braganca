<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover para respeitar as safe-areas do iPhone -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0">
  <!-- a barra do sistema acompanha o tema claro/escuro -->
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Obra Bragança</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <!--
    Sprite de icones: traco monocromatico 1.5px, estilo SF Symbols / Lucide.
    Inline de proposito — mantem a app offline-first sem pedidos extra.
    Usar com <svg class="ic"><use href="#i-nome"></use></svg>
  -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <g id="s-base" fill="none" stroke="currentColor" stroke-width="1.5"
         stroke-linecap="round" stroke-linejoin="round"></g>
    </defs>
    <symbol id="i-painel" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/>
      <rect x="14" y="14" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/>
    </symbol>
    <symbol id="i-custos" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 10h11"/><path d="M4 14h9"/>
      <path d="M19.5 6.2A7.6 7.6 0 0 0 14.3 4 7.9 7.9 0 0 0 6.5 12c0 4.4 3.5 8 7.8 8a7.6 7.6 0 0 0 5.2-2.2"/>
    </symbol>
    <symbol id="i-pagamentos" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="5" width="20" height="14" rx="2.5"/><path d="M2 10h20"/><path d="M6 15h4"/>
    </symbol>
    <symbol id="i-plano" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="m3 7 1.8 1.8L8 5.5"/><path d="m3 17 1.8 1.8L8 15.5"/>
      <path d="M12 7h9"/><path d="M12 12h9"/><path d="M12 17h9"/>
    </symbol>
    <symbol id="i-plantas" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="m9 4-6 2.6v13L9 17l6 3 6-2.6v-13L15 7z"/><path d="M9 4v13"/><path d="M15 7v13"/>
    </symbol>
    <symbol id="i-venda" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M16 7h6v6"/><path d="m22 7-8.5 8.5-5-5L2 17"/>
    </symbol>

    <symbol id="i-mais" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 12h14"/><path d="M12 5v14"/>
    </symbol>
    <symbol id="i-fechar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
    </symbol>
    <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 6 9 17l-5-5"/>
    </symbol>
    <symbol id="i-seta" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="m9 18 6-6-6-6"/>
    </symbol>
    <symbol id="i-lixo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3.5 6h17"/><path d="M18.5 6v13a2 2 0 0 1-2 2h-9a2 2 0 0 1-2-2V6"/>
      <path d="M9 6V4.5a1.5 1.5 0 0 1 1.5-1.5h3A1.5 1.5 0 0 1 15 4.5V6"/>
    </symbol>
    <symbol id="i-camara" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14.5 4h-5L7.5 7H4.5a2 2 0 0 0-2 2v8.5a2 2 0 0 0 2 2h15a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z"/>
      <circle cx="12" cy="13" r="3.2"/>
    </symbol>
    <symbol id="i-sync" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3.5 12a8.5 8.5 0 0 1 14.4-6.1L21 8.5"/><path d="M21 3.5v5h-5"/>
      <path d="M20.5 12a8.5 8.5 0 0 1-14.4 6.1L3 15.5"/><path d="M3 20.5v-5h5"/>
    </symbol>
    <symbol id="i-descarregar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15.5V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-3.5"/><path d="m7.5 10.5 4.5 4.5 4.5-4.5"/><path d="M12 3v12"/>
    </symbol>
    <symbol id="i-repor" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 12a9 9 0 1 0 2.6-6.4L3 8"/><path d="M3 3.5v5h5"/>
    </symbol>
    <symbol id="i-aviso" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10.3 4 3 17a2 2 0 0 0 1.7 3h14.6a2 2 0 0 0 1.7-3L13.7 4a2 2 0 0 0-3.4 0z"/>
      <path d="M12 9.5v4"/><path d="M12 17h.01"/>
    </symbol>
    <symbol id="i-ficheiro" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14.5 2.5H7a2 2 0 0 0-2 2v15a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7z"/>
      <path d="M14 2.5V6a2 2 0 0 0 2 2h3.5"/><path d="M9 13h6"/><path d="M9 17h6"/>
    </symbol>
  </svg>

  <!-- Cabecalho: nome do ecra atual, sempre visivel -->
  <header class="cabecalho" id="cabecalho">
    <h1 class="cabecalho__titulo" id="titulo-ecra">Painel</h1>
  </header>

  <!-- Conteudo do ecra ativo -->
  <main class="conteudo" id="conteudo">
    <!-- preenchido por js/app.js -->
  </main>

  <!-- Barra de navegacao inferior fixa -->
  <nav class="tabbar" id="tabbar" aria-label="Navegação principal">
    <button class="tabbar__botao" data-ecra="painel" aria-label="Painel">
      <svg class="tabbar__icone ic" aria-hidden="true"><use href="#i-painel"></use></svg>
      <span class="tabbar__texto">Painel</span>
    </button>
    <button class="tabbar__botao" data-ecra="custos" aria-label="Custos">
      <svg class="tabbar__icone ic" aria-hidden="true"><use href="#i-custos"></use></svg>
      <span class="tabbar__texto">Custos</span>
    </button>
    <button class="tabbar__botao" data-ecra="pagamentos" aria-label="Pagamentos">
      <svg class="tabbar__icone ic" aria-hidden="true"><use href="#i-pagamentos"></use></svg>
      <span class="tabbar__texto">Pagam.</span>
    </button>
    <button class="tabbar__botao" data-ecra="cronograma" aria-label="Plano de ações">
      <svg class="tabbar__icone ic" aria-hidden="true"><use href="#i-plano"></use></svg>
      <span class="tabbar__texto">Plano</span>
    </button>
    <button class="tabbar__botao" data-ecra="plantas" aria-label="Plantas">
      <svg class="tabbar__icone ic" aria-hidden="true"><use href="#i-plantas"></use></svg>
      <span class="tabbar__texto">Plantas</span>
    </button>
    <button class="tabbar__botao" data-ecra="venda" aria-label="Venda">
      <svg class="tabbar__icone ic" aria-hidden="true"><use href="#i-venda"></use></svg>
      <span class="tabbar__texto">Venda</span>
    </button>
  </nav>

  <!-- SheetJS (local, sem CDN) para exportar Excel: define window.XLSX -->
  <script src="js/vendor/xlsx.mini.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
