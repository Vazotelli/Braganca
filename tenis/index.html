    h+=`<div class="row" style="gap:18px;flex-wrap:wrap"><div><div class="kpi num">${W}<span class="unit">-${jg.length-W}</span></div><div class="label">vitórias-derrotas</div></div><div><div class="kpi md num ${fp>=60?'g':fp>=50?'y':'r'}">${Math.round(fp)}<span class="unit">%</span></div><div class="label">1.º serviço (méd.)</div></div><div><div class="kpi md num ${sets&&df/sets<3?'g':'y'}">${sets?(df/sets).toFixed(1):'–'}</div><div class="label">duplas faltas / set</div></div></div>
      ${jg.length>=2?lineChart({series:[{pts:jg.map(j=>({y:j.firstPct})),color:'var(--green)'},{pts:jg.map(j=>({y:j.sets?j.df/j.sets*10:null})),color:'var(--red)',width:1.5,op:.7}],yMin:0,yMax:100,yFmt:v=>Math.round(v),xLabels:[{i:0,t:fmtShort(jg[0].d)},{i:jg.length-1,t:fmtShort(jg[jg.length-1].d)}]})+`<div class="legend"><span><i style="background:var(--green)"></i>% 1.º serviço</span><span><i style="background:var(--red)"></i>DF por set ×10</span></div>`:''}
      <table class="table mt12"><tr><th>Data</th><th>Adversário</th><th>Result.</th><th class="n">1.º %</th><th class="n">DF/set</th></tr>${jg.slice(-6).reverse().map(j=>`<tr><td class="num">${fmtShort(j.d)}</td><td>${esc(j.opp||'–')}</td><td class="${j.result==='W'?'g':'r'}">${j.result==='W'?'V':'D'} ${esc(j.score||'')}</td><td class="n num">${j.firstPct}</td><td class="n num">${j.sets?(j.df/j.sets).toFixed(1):'–'}</td></tr>`).join('')}</table>`}
  h+=`</div>`;
  // --- Histórico ---
  h+=`<div class="sec">Histórico <span class="muted xs" style="text-transform:none;letter-spacing:0;font-weight:600">${recs.length} sessões</span></div><div class="card">`;
  if(!recs.length)h+=`<div class="empty">Nada registado ainda.</div>`;
  else h+=`<div class="list">${recs.slice(-12).reverse().map(r=>`<div class="item tap" data-act="view-session" data-id="${r.id}"><div class="dot" style="background:var(--${r.swapReason?'yellow':r.intensity==='high'?'red':'blue'})"></div><div class="grow"><div style="font-weight:700;font-size:14px">${esc(r.short||r.name)}${r.swapReason?' <span class="badge y">troca</span>':''}</div><div class="small muted">${fmtShort(r.date)} · ${r.durationMin} min · RPE ${r.rpe||'–'}${r.summaryLine?' · '+esc(r.summaryLine):''}</div></div><div class="num muted small">${sessionLoad(r)}</div></div>`).join('')}</div>`;
  h+=`</div>`;
  $('#scr-progresso').innerHTML=h;
}

// ============================== DEFINIÇÕES / BACKUP ==============================
function openSettings(){
  const s=S.settings;
  sheet(`<h2>Definições</h2><div class="small muted">Plano, backup e preferências.</div>
    <div class="field"><label>Início do plano (segunda-feira da semana 1)</label><input type="date" class="input" value="${s.startDate}" data-set="startDate"></div>
    <div class="field"><label>Dia de fim de semana disponível</label><div class="seg"><button class="${s.weekendDay==='sat'?'on':''}" data-act="set-weekend" data-v="sat">Sábado</button><button class="${s.weekendDay==='sun'?'on':''}" data-act="set-weekend" data-v="sun">Domingo</button></div></div>
    <div class="field"><label>Data da prova / torneio (opcional)</label><input type="date" class="input" value="${s.matchDate||''}" data-set="matchDate"><div class="xs muted mt4">A semana da prova corta 40% do volume técnico e tira a força pesada nos 3 dias anteriores.</div></div>
    <div class="field"><label>Tema</label><div class="seg"><button class="${s.theme!=='light'?'on':''}" data-act="set-theme" data-v="dark">Escuro</button><button class="${s.theme==='light'?'on':''}" data-act="set-theme" data-v="light">Claro</button></div></div>
    <div class="sec" style="padding:0;margin-top:20px">Backup</div>
    <div class="small muted mt4">O JSON contém tudo: sessões, check-ins, trocas, definições. Guarda-o fora do telemóvel de vez em quando.</div>
    <div class="btn-row mt12"><button class="btn sm" data-act="export">Exportar JSON</button><label class="btn sm">Importar JSON<input type="file" accept=".json,application/json" class="hide" data-act-input="import-json"></label></div>
    <div class="btn-row mt8"><button class="btn sm ghost" data-act="copy-json">Copiar JSON</button><button class="btn sm ghost" data-act="paste-json">Colar JSON</button></div>
    <div class="row between mt16 small muted"><span class="num">${S.sessions.length} sessões · ${Object.keys(S.health).length} check-ins · ${S.swaps.length} trocas</span><span class="num">${(JSON.stringify(S).length/1024).toFixed(0)} KB</span></div>
    <button class="btn danger sm mt16" data-act="reset-all">Apagar todos os dados</button>
    <div class="xs dim mt12">Tennis Training OS · ficheiro único, offline. Nenhum pedido de rede em runtime.</div>`);
}
function exportJSON(){
  const data=JSON.stringify(S,null,1);const name='tennis-os-backup-'+today()+'.json';
  try{const blob=new Blob([data],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},1500);toast('Exportado: '+name)}
  catch(e){toast('Não deu para descarregar. Usa "Copiar JSON".',3000)}
}
function importJSONText(txt){
  let obj;try{obj=JSON.parse(txt)}catch(e){toast('JSON inválido',3000);return false}
  if(!obj||typeof obj!=='object'||!Array.isArray(obj.sessions)||typeof obj.health!=='object'){toast('Isto não é um backup do Tennis OS',3000);return false}
  if(!confirm(`Importar ${obj.sessions.length} sessões e ${Object.keys(obj.health).length} check-ins? Substitui os dados atuais.`))return false;
  S=migrate(obj);saveNow();applyTheme();closeSheet();render();toast('Importado com sucesso');return true;
}
function applyTheme(){document.documentElement.dataset.theme=S.settings.theme==='light'?'light':'dark';const m=$('meta[name=theme-color]');if(m)m.content=S.settings.theme==='light'?'#EEF1F5':'#0B0E11'}

// ============================== SHEET / OVERLAY ==============================
function sheet(html){$('#overlay').innerHTML=`<div class="backdrop" data-act="close-sheet"><div class="sheet"><div class="grab"></div>${html}</div></div>`}
function closeSheet(){$('#overlay').innerHTML=''}

// ============================== AÇÕES ==============================
const ACT={
  tab(el){S.ui.tab=el.dataset.tab;save();render();window.scrollTo(0,0)},
  'alert-act'(el){const [k,v]=el.dataset.target.split(':');if(k==='tab'){S.ui.tab=v;save();render()}},
  'open-settings'(){openSettings()},
  'close-sheet'(el,e){if(el.classList.contains('backdrop')&&e&&e.target!==el)return;closeSheet()},
  'set-weekend'(el){S.settings.weekendDay=el.dataset.v;save();openSettings();render()},
  'set-theme'(el){S.settings.theme=el.dataset.v;save();applyTheme();openSettings()},
  export(){exportJSON()},
  'copy-json'(){const txt=JSON.stringify(S);if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(()=>toast('JSON copiado ('+(txt.length/1024).toFixed(0)+' KB)'),()=>toast('Não consegui copiar'));else toast('Clipboard indisponível')},
  'paste-json'(){const txt=prompt('Cola aqui o JSON do backup:');if(txt)importJSONText(txt)},
  'reset-all'(){if(confirm('Apagar TODOS os dados desta app? Não há volta.')){if(confirm('Mesmo? Exportaste o JSON primeiro?')){S=defaultState();saveNow();closeSheet();applyTheme();render();toast('Dados apagados')}}},
  'plan-week'(el){const mon=S.ui.planWeek||mondayOf(today());S.ui.planWeek=addDays(mon,7*num(el.dataset.n));S.ui.planSel=null;save();render()},
  'plan-sel'(el){S.ui.planSel=el.dataset.d;save();render()},
  'undo-override'(el){const d=el.dataset.d;delete S.overrides[d];S.swaps=S.swaps.filter(s=>!(s.date===d&&!s.done));save();render();toast('Troca anulada')},
  // saúde
  'hdate'(el){const d=S.ui.healthDate||today();S.ui.healthDate=addDays(d,num(el.dataset.n));if(S.ui.healthDate>today())S.ui.healthDate=today();save();render()},
  'hseg'(el){const k=el.dataset.k;$$(`[data-act="hseg"][data-k="${k}"]`).forEach(b=>b.classList.toggle('on',b===el))},
  'hpain'(el){const k=el.dataset.k;$$(`[data-act="hpain"][data-k="${k}"]`).forEach(b=>{const on=b===el;b.classList.toggle('on',on);const v=num(b.dataset.v);b.style.cssText=on&&v>=2?'border-color:var(--red);background:var(--red-bg);color:var(--red)':''})},
  'hstep'(el){const v=$('[data-hstep="sleepH"] .val');v.textContent=clamp(num(v.textContent)+num(el.dataset.n),0,14)},
  'hsave'(){const d=S.ui.healthDate&&S.ui.healthDate<=today()?S.ui.healthDate:today();S.health[d]=healthDraft(d);save();const r=readiness(d);toast('Prontidão '+r.score+' · '+r.band.name);S.ui.healthDate=null;render()},
  // sessão
  'start-session'(){tryStart()},
  'start-anyway'(){const d=today();const r=resolveDay(d);startSession(r.key,r.ov?r.ov.opts:{},{swapReason:r.ov?r.ov.reason:null,swapDetail:r.ov?r.ov.detail:null,planned:r.planned})},
  'start-reduced'(){const d=today();const r=resolveDay(d);const opts=Object.assign({},r.ov?r.ov.opts:{},{factor:0.6});S.overrides[d]={key:r.key,opts,reason:'tired',detail:'prontidão/dias seguidos'};S.swaps=S.swaps.filter(x=>x.date!==d);S.swaps.push({date:d,from:r.planned,to:r.key,reason:'tired',detail:'aviso antes de iniciar',at:new Date().toISOString(),done:false});save();startSession(r.key,opts,{swapReason:'tired',swapDetail:'aviso antes de iniciar',planned:r.planned})},
  'start-mob'(){const d=today();const r=resolveDay(d);S.overrides[d]={key:'MOB',opts:{},reason:'tired',detail:'prontidão baixa'};S.swaps=S.swaps.filter(x=>x.date!==d);S.swaps.push({date:d,from:r.planned,to:'MOB',reason:'tired',detail:'prontidão baixa',at:new Date().toISOString(),done:false});save();startSession('MOB',{},{swapReason:'tired',swapDetail:'prontidão baixa',planned:r.planned})},
  'resume-session'(){renderSession()},
  'discard-session'(){if(confirm('Descartar a sessão em curso? Os registos parciais perdem-se.')){S.active=null;T.exId=null;save();$('#fs').innerHTML='';render()}},
  'view-session'(el){viewSession(el.dataset.id)},
  'delete-session'(el){if(confirm('Apagar este registo?')){S.sessions=S.sessions.filter(s=>s.id!==el.dataset.id);save();closeSheet();render();toast('Registo apagado')}},
  'start-extra'(){extraChooser()},
  'extra-start'(el){startSession(el.dataset.k,{},{extra:true,planned:plannedKey(today())})},
  'log-past'(el){S.ui.pastKey=S.ui.pastKey||'S1';S.ui.pastDur=null;S.ui.pastRpe=6;logPastSheet(el.dataset.d)},
  'past-key'(el){S.ui.pastKey=el.dataset.v;S.ui.pastDur=SESSIONS[el.dataset.v].dur;const d=$('[data-act="past-save"]').dataset.d;logPastSheet(d)},
  'past-n'(el){const v=$('#past-dur');const n=clamp(num(v.textContent)+num(el.dataset.n),10,240);S.ui.pastDur=n;v.innerHTML=n+'<span class="unit">min</span>'},
  'past-rpe'(el){S.ui.pastRpe=num(el.dataset.v);$$('[data-act="past-rpe"]').forEach(b=>b.classList.toggle('on',b===el))},
  'past-res'(el){$$('[data-act="past-res"]').forEach(b=>b.classList.toggle('on',b===el))},
  'past-save'(el){savePast(el.dataset.d)},
  'prog-ex'(el){S.ui.progEx=el.dataset.v;save();render()},
  // trocas
  'swap-open'(){openSwap()},
  'swap-pick'(el){const k=el.dataset.k;if(k==='pain'){sheet(`<h2>Onde é a dor?</h2><div class="small muted">Ombro ou cotovelo bloqueiam todos os blocos de serviço. Joelho tira saltos, corrida e spider. Costas tira cargas na anca.</div>${PAIN_SEGS.map(([s,l])=>`<div class="opt" data-act="swap-pain" data-v="${s}"><div class="ico bg-r">⚠️</div><div class="grow"><b>${l}</b><span>${s==='ombro'||s==='cotovelo'?'Sem serviço, sem puxar/empurrar':s==='joelho'?'Sem impacto: sem saltos, corrida, spider, corda':'Sem nórdico, ponte, agachamento com salto'}</span></div>${ICON.right}</div>`).join('')}<button class="btn sm ghost mt12" data-act="swap-open">Voltar</button>`);return}swapPreview(k)},
  'swap-pain'(el){swapPreview('pain',el.dataset.v)},
  'swap-confirm'(el){confirmSwap(el.dataset.k,el.dataset.detail,true)},
  'swap-confirm-only'(el){confirmSwap(el.dataset.k,el.dataset.detail,false)},
  // sessão ativa: controlos
  's-exit'(){tPause();$('#fs').innerHTML='';save();render();toast('Sessão guardada como rascunho')},
  's-toggle'(el){const id=el.dataset.ex;const a=S.active;const prev=a.open;a.open=prev===id?null:id;save();if(prev&&prev!==id)rerenderEx(prev);rerenderEx(id);if(a.open){const c=$('#ex-'+id);if(c)setTimeout(()=>c.scrollIntoView({behavior:'smooth',block:'start'}),60)}},
  's-check'(el){const l=S.active.logs[el.dataset.ex];l.done=!l.done;save();rerenderEx(el.dataset.ex)},
  's-tempo-sets'(el){const e=findEx(el.dataset.ex);const l=S.active.logs[e.id];l.sets=clamp(l.sets+num(el.dataset.n),0,e.sets);l.secs=l.sets*e.secs;save();rerenderEx(e.id)},
  's-tempo-secs'(el){const e=findEx(el.dataset.ex);const l=S.active.logs[e.id];l.secs=clamp(l.secs+num(el.dataset.n),0,3*3600);save();rerenderEx(e.id)},
  's-reps'(el){const l=S.active.logs[el.dataset.ex];const s=l.sets[num(el.dataset.i)];s.reps=clamp(s.reps+num(el.dataset.n),0,120);save();rerenderEx(el.dataset.ex)},
  's-set-done'(el){const l=S.active.logs[el.dataset.ex];const s=l.sets[num(el.dataset.i)];s.done=!s.done;save();rerenderEx(el.dataset.ex)},
  's-diff'(el){S.active.logs[el.dataset.ex].diff=num(el.dataset.v);save();rerenderEx(el.dataset.ex)},
  's-round'(el){const l=S.active.logs[el.dataset.ex];const r=l.rounds[num(el.dataset.i)];const f=el.dataset.f,n=num(el.dataset.n);
    if(f==='s'){r.s=clamp(r.s+n,1,30);if(r.in!=null)r.in=Math.min(r.in,r.s);if(r.t!=null)r.t=Math.min(r.t,r.in==null?r.s:r.in)}
    else if(f==='in'){r.in=clamp((r.in==null?0:r.in)+n,0,r.s);if(r.t==null)r.t=0;r.t=Math.min(r.t,r.in)}
    else{if(r.in==null){r.in=0}r.t=clamp((r.t==null?0:r.t)+n,0,r.in)}
    save();rerenderEx(el.dataset.ex)},
  's-spider-start'(el){const e=findEx(el.dataset.ex);tStart(e.id,'up',0,'lap')},
  's-spider-lap'(el){const e=findEx(el.dataset.ex);const l=S.active.logs[e.id];const t=Math.round(tElapsed()*10)/10;l.laps.push(t);save();if(l.laps.length>=e.reps){tClear()}else tStart(e.id,'down',e.rest,'rest',null,'rest')},
  's-spider-undo'(el){const l=S.active.logs[el.dataset.ex];l.laps.pop();save();if(T.exId===el.dataset.ex)tClear();else rerenderEx(el.dataset.ex)},
  's-int-start'(el){const e=findEx(el.dataset.ex);const l=S.active.logs[e.id];tStart(e.id,'down',e.work,'int',{k:'work',i:l.reps+1},'work')},
  's-int-reps'(el){const e=findEx(el.dataset.ex);const l=S.active.logs[e.id];l.reps=clamp(l.reps+num(el.dataset.n),0,e.reps);save();rerenderEx(e.id)},
  's-int-feel'(el){S.active.logs[el.dataset.ex].feel=num(el.dataset.v);save();rerenderEx(el.dataset.ex)},
  's-t-start'(el){const e=findEx(el.dataset.ex);const total=e.type==='sets_reps'?(e.repsN||30):e.secs;tStart(e.id,'down',total,e.type==='sets_reps'?'hold':'tempo')},
  's-t-pause'(){tPause()},'s-t-resume'(){tResume()},
  's-t-stop'(el){const e=findEx(el.dataset.ex);const l=S.active.logs[e.id];const done=tElapsed();if(T.kind==='tempo'&&done>5){l.secs+=Math.round(done)}save();tClear()},
  's-jogo-n'(el){const l=S.active.logs[el.dataset.ex];const f=el.dataset.f;l[f]=clamp(l[f]+num(el.dataset.n),f==='sets'?1:0,f==='sets'?5:40);save();rerenderEx(el.dataset.ex)},
  's-jogo-res'(el){S.active.logs[el.dataset.ex].result=el.dataset.v;save();rerenderEx(el.dataset.ex)},
  's-aula-n'(el){const l=S.active.logs.aula;const f=el.dataset.f;l[f]=clamp(l[f]+num(el.dataset.n),f==='durationMin'?15:0,f==='durationMin'?180:400);save();renderSession()},
  's-aula-rpe'(el){S.active.logs.aula.rpe=num(el.dataset.v);save();renderSession()},
  's-aula-chip'(el){const l=S.active.logs.aula;const v=el.dataset.v;l.chips=l.chips.includes(v)?l.chips.filter(x=>x!==v):[...l.chips,v];save();renderSession()},
  's-aula-save'(){saveActive()},
  's-finish'(){tPause();finishSheet()},
  's-dur'(el){const a=S.active;a.durationMin=clamp((a.durationMin||a.session.est)+num(el.dataset.n),5,300);$('#fin-dur').innerHTML=a.durationMin+'<span class="unit">min</span>';save()},
  's-rpe'(el){S.active.rpe=num(el.dataset.v);save();$$('[data-act="s-rpe"]').forEach(b=>b.classList.toggle('on',b===el))},
  's-save-final'(){const a=S.active;a.notes=$('#fin-notes').value;if(!a.rpe){toast('Falta o RPE da sessão');return}saveActive()}
};
function findEx(id){for(const b of S.active.session.blocks)for(const e of b.ex)if(e.id===id)return e;return null}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  if(el.tagName==='LABEL')return; // deixa o input file abrir
  const fn=ACT[el.dataset.act];if(fn){fn(el,e)}
});
document.addEventListener('input',e=>{
  const el=e.target;if(!el.dataset.log||!S.active)return;
  const [ex,f]=el.dataset.log.split(':');const l=S.active.logs[ex];if(!l)return;
  l[f]=el.dataset.num?num(el.value):el.value;save();
  if(f==='firstPct'){const t=$('#fp-'+ex);if(t)t.textContent=l[f]+'%'}
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.set){S.settings[el.dataset.set]=el.value;if(el.dataset.set==='startDate'&&el.value){S.settings.startDate=mondayOf(el.value)}save();render();return}
  if(el.dataset.actInput==='import-json'){const f=el.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>importJSONText(rd.result);rd.readAsText(f);el.value=''}
  if(el.dataset.actInput==='hrhr'){/* guardado no hsave */}
});

// ============================== SVG (etapa 3 substitui) ==============================
function svgFor(key,size){
  return `<svg viewBox="0 0 120 60" fill="none" stroke="var(--text)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="60" cy="14" r="6"/><path d="M60 20v18M60 26l-12 8M60 26l12 8M60 38l-8 14M60 38l8 14"/><path d="M10 56h100" stroke="var(--line2)"/></svg>`;
}

// ============================== INIT ==============================
applyTheme();
render();
saveNow();
// sessão em curso de hoje: retoma automaticamente
if(S.active&&S.active.date===today())renderSession();else if(S.active&&S.active.date!==today()){/* rascunho de outro dia fica disponível em Hoje só se for hoje; descarta-se silenciosamente */S.active=null;save()}
</script>
