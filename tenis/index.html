// ---------- Cronómetro ----------
const T={exId:null,mode:null,total:0,startAt:0,base:0,running:false,kind:null,phase:null,cls:''};
function tElapsed(){return T.base+(T.running?(Date.now()-T.startAt)/1000:0)}
function tStart(exId,mode,total,kind,phase,cls){T.exId=exId;T.mode=mode;T.total=total;T.kind=kind;T.phase=phase||null;T.cls=cls||'';T.base=0;T.startAt=Date.now();T.running=true;rerenderEx(exId)}
function tPause(){if(!T.running)return;T.base=tElapsed();T.running=false;rerenderEx(T.exId)}
function tResume(){if(T.running||!T.exId)return;T.startAt=Date.now();T.running=true;rerenderEx(T.exId)}
function tClear(){const id=T.exId;T.exId=null;T.running=false;T.mode=null;T.phase=null;if(id)rerenderEx(id)}
function tick(){
  const el=$('#fs-elapsed');if(el&&S.active)el.textContent=elapsedMin()+' min';
  if(!T.exId)return;
  if(T.mode==='down'&&T.running&&tElapsed()>=T.total){T.running=false;T.base=T.total;onTimerDone();return}
  timerPaint();
}
setInterval(tick,200);
function timerPaint(){
  if(!T.exId)return;const box=$('#timer-'+T.exId);if(!box)return;const t=$('.t',box);if(!t)return;
  const el=tElapsed();
  if(T.mode==='down')t.textContent=fmtMMSS(Math.ceil(T.total-el));
  else if(T.kind==='walk')t.textContent=fmtMMSS(el);
  else t.textContent=el>=60?fmtMMSS(el):(Math.floor(el*10)/10).toFixed(1);
}
function onTimerDone(){
  const a=S.active;if(!a){tClear();return}const id=T.exId;const log=a.logs[id];let e=null;for(const b of a.session.blocks)for(const x of b.ex)if(x.id===id)e=x;
  if(navigator.vibrate)try{navigator.vibrate([120,60,120])}catch(_){}
  if(!e||!log){tClear();return}
  if(T.kind==='tempo'){log.secs+=T.total;log.sets+=1;save();tClear();return}
  if(T.kind==='rest'){tClear();return} // spider: pausa acabou, pronto para a próxima
  if(T.kind==='int'){
    const ph=T.phase;
    if(ph.k==='work'){log.reps=Math.min(e.reps,log.reps+1);save();if(ph.i>=e.reps){tClear();return}tStart(id,'down',e.rest,'int',{k:'rest',i:ph.i},'rest');return}
    tStart(id,'down',e.work,'int',{k:'work',i:ph.i+1},'work');return;
  }
  tClear();
}
function timerBoxHtml(e,log){
  const mine=T.exId===e.id;const id=e.id;
  const btn=(act,label,cls='')=>`<button class="btn sm ${cls}" data-act="${act}" data-ex="${id}">${label}</button>`;
  if(e.type==='spider'){
    if(mine&&T.mode==='up')return `<div class="timer work" id="timer-${id}"><div class="t num">0.0</div><div class="st">Repetição ${log.laps.length+1} a correr</div><div class="btn-row mt12">${btn('s-spider-lap','Cheguei ao centro · parar','primary')}</div></div>`;
    if(mine&&T.mode==='down')return `<div class="timer rest" id="timer-${id}"><div class="t num">${fmtMMSS(T.total)}</div><div class="st">Pausa · ${e.rest} s</div><div class="btn-row mt12">${btn('s-spider-start','Saltar pausa e arrancar')}</div></div>`;
    if(log.laps.length>=e.reps)return `<div class="timer done" id="timer-${id}"><div class="t num">${fmtLap(Math.min(...log.laps))}</div><div class="st g">Completo · melhor volta</div></div>`;
    return `<div class="timer" id="timer-${id}"><div class="t num">0.0</div><div class="st">Pronto · rep ${log.laps.length+1}</div><div class="btn-row mt12">${btn('s-spider-start','Arrancar rep '+(log.laps.length+1),'primary')}</div></div>`;
  }
  if(e.type==='corrida_intervalos'){
    if(mine){const ph=T.phase||{k:'work',i:1};return `<div class="timer ${ph.k}" id="timer-${id}"><div class="t num">${fmtMMSS(T.total-tElapsed())}</div><div class="st">Rep ${ph.i}/${e.reps} · ${ph.k==='work'?'FORTE':'ANDAR'}</div><div class="btn-row mt12">${T.running?btn('s-t-pause','Pausa'):btn('s-t-resume','Retomar','primary')}${btn('s-t-stop','Parar','danger')}</div></div>`}
    if(log.reps>=e.reps)return `<div class="timer done" id="timer-${id}"><div class="t num">${e.reps}/${e.reps}</div><div class="st g">Intervalos completos</div></div>`;
    return `<div class="timer" id="timer-${id}"><div class="t num">${fmtMMSS(e.work)}</div><div class="st">${e.reps-log.reps} reps por fazer · ${e.work} s forte / ${e.rest} s a andar</div><div class="btn-row mt12">${btn('s-int-start',log.reps?'Continuar na rep '+(log.reps+1):'Iniciar cronómetro','primary')}${btn('s-ex-done','Já fiz')}</div><div class="ghost-hint">O cronómetro é opcional. Se correste sem o telemóvel, toca em "Já fiz".</div></div>`;
  }
  if(e.type==='passos'){
    if(mine)return `<div class="timer work" id="timer-${id}"><div class="t num">${fmtMMSS(tElapsed())}</div><div class="st">${T.running?'A caminhar':'Em pausa'}</div><div class="btn-row mt12">${T.running?btn('s-t-pause','Pausa'):btn('s-t-resume','Retomar','primary')}${btn('s-t-stop','Parar e somar','danger')}</div></div>`;
    return `<div class="timer" id="timer-${id}"><div class="t num">00:00</div><div class="st">Cronómetro · soma à duração</div><div class="btn-row mt12">${btn('s-t-start','Arrancar','primary')}</div></div>`;
  }
  // tempo e sets_reps em segundos
  const total=e.type==='sets_reps'?e.repsN||30:e.secs;
  const setsLeft=e.type==='sets_reps'?log.sets.filter(s=>!s.done).length:(e.sets>1?e.sets-log.sets:(log.secs>=e.secs?0:1));
  if(mine)return `<div class="timer work" id="timer-${id}"><div class="t num">${fmtMMSS(T.total-tElapsed())}</div><div class="st">${T.running?'A contar':'Em pausa'}</div><div class="btn-row mt12">${T.running?btn('s-t-pause','Pausa'):btn('s-t-resume','Retomar','primary')}${btn('s-t-stop','Parar','danger')}</div></div>`;
  if(setsLeft<=0)return `<div class="timer done" id="timer-${id}"><div class="t num">${fmtMMSS(total)}</div><div class="st g">Completo</div></div>`;
  return `<div class="timer" id="timer-${id}"><div class="t num">${fmtMMSS(total)}</div><div class="st">Cronómetro · ${e.type==='sets_reps'?'série de '+total+' s':(e.sets>1?'série '+(log.sets+1)+' de '+e.sets:'contagem decrescente')}</div><div class="btn-row mt12">${btn('s-t-start','Iniciar','primary')}${btn('s-ex-done','Já fiz')}</div></div>`;
}

// ---------- RPE a partir do print do relógio ----------
// FC máxima: a medida, se a tiveres; senão a fórmula de Tanaka (208 − 0,7 × idade), que erra menos
// que a velha 220 − idade; senão a mais alta que já vi nos teus prints (subestima, e é assumido).
function hrMaxRef(){
  const s=S.settings;
  if(s.hrMax>0)return {v:s.hrMax,fonte:'a FC máxima que puseste nas definições'};
  if(s.age>0)return {v:Math.round(208-0.7*s.age),fonte:'estimativa pela tua idade ('+s.age+' anos)'};
  let obs=0;for(const r of S.sessions)if(r.hrMax>obs)obs=r.hrMax;
  if(obs>0)return {v:obs,fonte:'a FC mais alta já vista nos teus prints ('+obs+'), que é um mínimo — o esforço real foi provavelmente menor'};
  return null;
}
// % da FC máxima da média da sessão → RPE. 50% = repouso ativo, 95%+ = máximo.
function rpeFromHr(hrAvg,hrMax){return clamp(Math.round((100*hrAvg/hrMax-50)/5),1,10)}
// ---------- Fim de sessão ----------
function finishSheet(){
  const a=S.active;const el=elapsedMin();const dur=a.durationMin||(el>=10?el:a.session.est);a.durationMin=dur;a.rpe=a.rpe||null;
  const done=[];let total=0;for(const b of a.session.blocks)if(!b.blocked)for(const e of b.ex){total++;if(isDone(e,a.logs[e.id]))done.push(e)}
  const sl=summaryLine(a.session,a.logs);
  sheet(`<h2>Terminar sessão</h2><div class="small muted">${done.length}/${total} exercícios concluídos${sl?' · '+esc(sl):''}</div>
    ${done.length<total?`<button class="btn sm mt12" style="width:100%" data-act="s-fill-rest">Marcar os outros ${total-done.length} como feitos</button><div class="ghost-hint">Para quando treinaste sem o telemóvel. Não inventa números de serviço, spider nem jogo.</div>`:''}
    <div class="field"><label>Duração real</label><div class="row between"><div class="stepper"><button data-act="s-dur" data-n="-5">−</button><div class="val num" style="min-width:80px" id="fin-dur">${dur}<span class="unit">min</span></div><button data-act="s-dur" data-n="5">+</button></div><span class="small muted">cronómetro: ${el} min</span></div></div>
    <div class="field"><label>RPE da sessão (1 muito leve · 10 máximo)</label>${rpeGridHtml(a.rpe,'s-rpe')}
      ${(()=>{
        if(a.hrAvg){
          const ref=hrMaxRef();
          return `<div class="alert g mt8" style="margin-left:0;margin-right:0">${ICON.check}<div><b>Lido do print: FC média ${a.hrAvg}${a.hrMax?', máxima '+a.hrMax:''}</b>${
            a.rpeAuto?'Dá '+Math.round(100*a.hrAvg/ref.v)+'% da FC máxima, o que corresponde a RPE '+a.rpeAuto+'. Usei '+ref.v+' bpm como FC máxima, por '+esc(ref.fonte)+'. Muda o RPE se não bateu certo com o que sentiste.'
              :'Falta saber a tua FC máxima para converter isto num RPE. Põe a idade nas Definições, ou escolhe o RPE à mão.'}</div></div>`;
        }
        return `<label class="btn sm mt8" style="width:100%">Classificar pelo print do relógio<input type="file" accept="image/*" class="hide" data-act-input="rpe-shot"></label>
          <div class="ghost-hint">Anexa o resumo do treino (o ecrã com FC média e máxima). Leio os números e proponho o RPE; a imagem não fica guardada.</div>`;
      })()}</div>
    <div class="field"><label>Notas</label><textarea class="input" id="fin-notes" placeholder="o que aprendi, o que ajustar…">${esc(a.notes||'')}</textarea></div>
    <div class="sheet-foot"><button class="btn primary" style="min-height:54px;width:100%" data-act="s-save-final">Guardar sessão</button>
    <button class="btn ghost sm" style="width:100%" data-act="close-sheet">Voltar à sessão</button></div>`);
}
function summaryLine(sess,logs){
  const parts=[];
  for(const b of sess.blocks)for(const e of b.ex){const l=logs[e.id];if(!l)continue;
    if(e.type==='servico'){const t=serveTotals(l);if(t.n)parts.push(`${t.in}/${t.s} dentro, ${t.t} no alvo (${pct(t.t,t.s)}%)`)}
    if(e.type==='spider'&&l.laps.length)parts.push('spider '+fmtLap(Math.min(...l.laps)));
    if(e.type==='corrida_intervalos'&&l.reps)parts.push(l.reps+'/'+e.reps+' intervalos');
    if(e.type==='jogo'&&l.result)parts.push((l.result==='W'?'Vitória':'Derrota')+(l.score?' '+l.score:'')+(l.opp?' vs '+l.opp:''));
    if(e.type==='aula')parts.push('Aula'+(l.chips.length?' · '+l.chips.join(', '):'')+(l.serves?' · ~'+l.serves+' serviços':''));
    if(e.type==='passos'&&(l.steps||l.min))parts.push(fmtN(l.steps)+' passos'+(l.min?' em '+l.min+' min':''));
  }
  return parts.join(' · ');
}
function sessionStats(sess,logs){
  const st={strength:{},serve:null,spider:null,rope:0,jogo:null,intervals:null,steps:null};
  for(const b of sess.blocks)for(const e of b.ex){const l=logs[e.id];if(!l)continue;
    if(e.type==='sets_reps'&&e.unit!=='s'){const reps=sum(l.sets.filter(s=>s.done).map(s=>s.reps*(e.perSide?2:1)));if(reps)st.strength[e.id]=reps}
    if(e.type==='servico'){const t=serveTotals(l);if(t.n){st.serve=st.serve?{s:st.serve.s+t.s,in:st.serve.in+t.in,t:st.serve.t+t.t}:{s:t.s,in:t.in,t:t.t}}}
    if(e.type==='spider'&&l.laps.length)st.spider={best:Math.min(...l.laps),mean:mean(l.laps),laps:l.laps.length};
    if(e.type==='tempo'&&/corda/.test(e.id))st.rope+=l.secs/60;
    if(e.type==='jogo'&&l.result)st.jogo={opp:l.opp,sets:l.sets,result:l.result,score:l.score,firstPct:l.firstPct,df:l.df};
    if(e.type==='corrida_intervalos')st.intervals={reps:l.reps,of:e.reps};
    if(e.type==='passos'&&(l.steps||l.min))st.steps={steps:l.steps,min:l.min,pace:l.pace,target:e.target};
  }
  return st;
}
function saveActive(){
  const a=S.active;if(!a)return;
  const s=a.session;const isLesson=s.lesson;
  const aula=isLesson?a.logs.aula:null;
  const rec={id:a.id,date:a.date,key:a.key,planned:a.planned,name:s.name,short:s.short,intensity:s.intensity,factor:s.factor,opts:s.opts||{},
    durationMin:isLesson?aula.durationMin:(a.durationMin||s.est),rpe:isLesson?aula.rpe:(a.rpe||null),notes:isLesson?aula.notes:(a.notes||''),
    startedAt:a.startedAt,endedAt:Date.now(),logs:a.logs,swapReason:a.swapReason,swapDetail:a.swapDetail,extra:a.extra,
    hrAvg:a.hrAvg||null,hrMax:a.hrMax||null,rpeAuto:a.rpeAuto||null,
    exercises:s.blocks.flatMap(b=>b.ex.map(e=>({id:e.id,name:e.name,type:e.type,sets:e.sets,reps:e.reps,unit:e.unit,perSide:e.perSide,rounds:e.rounds,secs:e.secs,repsTarget:e.reps}))),
    summaryLine:summaryLine(s,a.logs),stats:sessionStats(s,a.logs)};
  S.sessions.push(rec);
  for(const b of s.blocks)for(const e of b.ex)if(a.logs[e.id]&&isDone(e,a.logs[e.id]))S.lastLogs[e.id]=JSON.parse(JSON.stringify(a.logs[e.id]));
  if(S.overrides[a.date]){delete S.overrides[a.date];S.swaps.forEach(x=>{if(x.date===a.date)x.done=true})}
  S.active=null;T.exId=null;T.running=false;save();
  $('#fs').innerHTML='';closeSheet();S.ui.tab='hoje';render();
  toast(rec.summaryLine||('Guardado · '+rec.durationMin+' min · RPE '+rec.rpe),3500);
}

}
function logPastSheet(d){

const SWAP_LABEL={rain:'Chuva / campo indisponível',travel:'Estou a viajar',time:'Sem tempo (30 min)',tired:'Cansado / prontidão baixa',match:'Consegui marcar jogo',pain:'Dor',walk:'Só dá para caminhar',extra:'Sessão extra',free:'Dia livre'};

  {k:'tired',ico:'🪫',t:'Cansado / prontidão baixa',s:'Sessão do dia a 60% do volume'},
  {k:'match',ico:'🎾',t:'Consegui marcar jogo',s:'Substitui a sessão por Jogo · 90 min'},

function swapTarget(reason,d,detail){
  const r=resolveDay(d);const base=r.planned==='S5'?'S5b':r.planned==='S6'?'S5c':(r.planned||r.key||'S5b');
  switch(reason){
    case 'rain':return {key:'RAIN',opts:{}};
    case 'travel':return {key:'S3',opts:{}};
    case 'time':return {key:base,opts:{short:true}};
    case 'tired':return {key:base,opts:{factor:0.6}};
    case 'match':return {key:'S5a',opts:{}};
    case 'walk':return {key:'WALK',opts:{}};
    case 'pain':{const seg=detail||'ombro';const opts={painSegs:[seg],blockServe:seg==='ombro'||seg==='cotovelo'};const s=buildSession(base,d,opts);const has=s&&s.blocks.some(b=>!b.blocked&&b.ex.length);return has?{key:base,opts}:{key:'MOB',opts:{}}}
  }
  return null;
}

function lineChart({series=[],w=340,h=170,yMin=null,yMax=null,yFmt=v=>Math.round(v),xLabels=[],band=null,bars=null,pad={l:34,r:10,t:10,b:22},yTicks=4,lowerBetter=false}){
  const all=series.flatMap(s=>s.pts.map(p=>p.y)).concat(bars?bars.map(b=>b.y):[]).concat(band?band.flatMap(b=>[b.lo,b.hi]):[]).filter(v=>v!=null&&isFinite(v));
  if(!all.length)return '';
  let lo=yMin!=null?yMin:Math.min(...all),hi=yMax!=null?yMax:Math.max(...all);if(hi===lo){hi=lo+1}if(yMin==null){lo=Math.max(0,lo-(hi-lo)*0.15)}if(yMax==null){hi=hi+(hi-lo)*0.1}
  const n=Math.max(...series.map(s=>s.pts.length),bars?bars.length:0,band?band.length:0);
  const X=i=>pad.l+(n<=1?(w-pad.l-pad.r)/2:(i/(n-1))*(w-pad.l-pad.r));const Y=v=>pad.t+(1-(v-lo)/(hi-lo))*(h-pad.t-pad.b);
  let g='';for(let i=0;i<=yTicks;i++){const v=lo+(hi-lo)*i/yTicks;g+=`<line x1="${pad.l}" x2="${w-pad.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line2)" stroke-width="1"/><text x="${pad.l-5}" y="${Y(v)+3.5}" text-anchor="end" font-size="9.5" fill="var(--muted)">${yFmt(v)}</text>`}
  let bnd='';if(band&&band.length){const up=band.map((b,i)=>`${X(i)},${Y(b.hi)}`),dn=band.map((b,i)=>`${X(i)},${Y(b.lo)}`).reverse();bnd=`<polygon points="${up.concat(dn).join(' ')}" fill="var(--green)" opacity=".13"/>`}
  let br='';if(bars){const bw=Math.max(6,(w-pad.l-pad.r)/Math.max(1,n)*0.55);br=bars.map((b,i)=>b.y==null?'':`<rect x="${X(i)-bw/2}" y="${Y(b.y)}" width="${bw}" height="${Math.max(0,Y(lo)-Y(b.y))}" rx="3" fill="${b.color||'var(--blue)'}" opacity="${b.op||0.9}"/>`).join('')}
  let ser='';for(const s of series){const pts=s.pts.map((p,i)=>p.y==null?null:[X(i),Y(p.y)]).filter(Boolean);if(!pts.length)continue;
    ser+=`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${s.color}" stroke-width="${s.width||2}" ${s.dash?`stroke-dasharray="${s.dash}"`:''} stroke-linejoin="round" stroke-linecap="round" opacity="${s.op||1}"/>`;
    if(s.dots!==false)ser+=pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.2" fill="${s.color}" stroke="var(--card)" stroke-width="1.5"/>`).join('')}
  let xl='';if(xLabels.length){xl=xLabels.map(l=>`<text x="${X(l.i)}" y="${h-6}" text-anchor="${l.i===0?'start':l.i===n-1?'end':'middle'}" font-size="9.5" fill="var(--muted)">${esc(l.t)}</text>`).join('')}
  return `<div class="chart"><svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="height:${h}px">${g}${bnd}${br}${ser}${xl}</svg></div>`;
}
function linreg(ys){const n=ys.length;if(n<2)return null;const xs=ys.map((_,i)=>i);const mx=mean(xs),my=mean(ys);let num=0,den=0;for(let i=0;i<n;i++){num+=(xs[i]-mx)*(ys[i]-my);den+=(xs[i]-mx)**2}const b=den?num/den:0;const a=my-b*mx;return {a,b,pts:xs.map(x=>a+b*x)}}

      ${lineChart({series:[{pts:sv.map(x=>({y:x.pin})),color:'var(--blue)',width:1.5,op:.55,dots:false},{pts:sv.map(x=>({y:x.p})),color:'var(--green)'}].concat(lr&&sv.length>=2?[{pts:lr.pts.map(y=>({y})),color:'var(--yellow)',dash:'4 4',dots:false,width:1.5}]:[]),yMin:0,yMax:100,yFmt:v=>Math.round(v)+'%',xLabels:[{i:0,t:fmtShort(sv[0].d)},{i:sv.length-1,t:fmtShort(last.d)}]})}

  if(wk.length||impDays){
    h+=`<div class="sec">Caminhada <span class="muted xs" style="text-transform:none;letter-spacing:0;font-weight:600">passos por sessão</span></div><div class="card">`;
    if(!wk.length)h+=`<div class="empty">Sem caminhadas registadas.<br>Tens <b>${impDays}</b> dias de passos importados, mas só contam para a carga se registares a sessão.</div>`;
    else{const tot=sum(wk.map(x=>x.y));const hit=wk.filter(x=>x.y>=x.target).length;
      h+=`<div class="row" style="gap:18px;flex-wrap:wrap"><div><div class="kpi num">${fmtN(wk[wk.length-1].y)}</div><div class="label">última caminhada</div></div><div><div class="kpi md num">${fmtN(Math.round(mean(wk.map(x=>x.y))))}</div><div class="label">média</div></div><div><div class="kpi md num ${hit>=wk.length/2?'g':'y'}">${hit}<span class="unit">/${wk.length}</span></div><div class="label">metas cumpridas</div></div></div>
        ${lineChart({bars:wk.map(x=>({y:x.y,color:x.y>=x.target?'var(--green)':'var(--blue)'})),series:[{pts:wk.map(x=>({y:x.target})),color:'var(--yellow)',dash:'4 4',dots:false,width:1.5}],yMin:0,yFmt:v=>v>=1000?Math.round(v/1000)+'k':Math.round(v),xLabels:[{i:0,t:fmtShort(wk[0].d)},{i:wk.length-1,t:fmtShort(wk[wk.length-1].d)}]})}
        <div class="legend"><span><i style="background:var(--green)"></i>meta cumprida</span><span><i style="background:var(--blue)"></i>abaixo</span><span><i style="background:var(--yellow)"></i>meta</span></div>
        <div class="small muted mt8">Total ${fmtN(tot)} passos em ${wk.length} caminhadas · ${sum(wk.map(x=>x.min))} min.</div>`}
    h+=`</div>`;
  }
  // --- Jogo ---
  const jg=recs.filter(r=>r.stats&&r.stats.jogo).map(r=>Object.assign({d:r.date},r.stats.jogo));
  h+=`<div class="sec">Estatísticas de jogo</div><div class="card">`;
  if(!jg.length)h+=`<div class="empty">Sem jogos registados. Usa "Trocar sessão → Consegui marcar jogo".</div>`;
  else{const W=jg.filter(j=>j.result==='W').length;const sets=sum(jg.map(j=>j.sets)),df=sum(jg.map(j=>j.df));const fp=mean(jg.map(j=>j.firstPct));
    h+=`<div class="row" style="gap:18px;flex-wrap:wrap"><div><div class="kpi num">${W}<span class="unit">-${jg.length-W}</span></div><div class="label">vitórias-derrotas</div></div><div><div class="kpi md num ${fp>=60?'g':fp>=50?'y':'r'}">${Math.round(fp)}<span class="unit">%</span></div><div class="label">1.º serviço (méd.)</div></div><div><div class="kpi md num ${sets&&df/sets<3?'g':'y'}">${sets?(df/sets).toFixed(1):'–'}</div><div class="label">duplas faltas / set</div></div></div>
      ${jg.length>=2?lineChart({series:[{pts:jg.map(j=>({y:j.firstPct})),color:'var(--green)'},{pts:jg.map(j=>({y:j.sets?j.df/j.sets*10:null})),color:'var(--red)',width:1.5,op:.7}],yMin:0,yMax:100,yFmt:v=>Math.round(v),xLabels:[{i:0,t:fmtShort(jg[0].d)},{i:jg.length-1,t:fmtShort(jg[jg.length-1].d)}]})+`<div class="legend"><span><i style="background:var(--green)"></i>% 1.º serviço</span><span><i style="background:var(--red)"></i>DF por set ×10</span></div>`:''}
      <table class="table mt12"><tr><th>Data</th><th>Adversário</th><th>Result.</th><th class="n">1.º %</th><th class="n">DF/set</th></tr>${jg.slice(-6).reverse().map(j=>`<tr><td class="num">${fmtShort(j.d)}</td><td>${esc(j.opp||'–')}</td><td class="${j.result==='W'?'g':'r'}">${j.result==='W'?'V':'D'} ${esc(j.score||'')}</td><td class="n num">${j.firstPct}</td><td class="n num">${j.sets?(j.df/j.sets).toFixed(1):'–'}</td></tr>`).join('')}</table>`}
  h+=`</div>`;
  // --- Histórico ---
  h+=`<div class="sec">Histórico <span class="muted xs" style="text-transform:none;letter-spacing:0;font-weight:600">${recs.length} sessões</span></div><div class="card">`;
  if(!recs.length)h+=`<div class="empty">Nada registado ainda.</div>`;
  else h+=`<div class="list">${recs.slice(-12).reverse().map(r=>`<div class="item tap" data-act="view-session" data-id="${r.id}"><div class="dot" style="background:var(--${r.swapReason?'yellow':r.intensity==='high'?'red':'blue'})"></div><div class="grow"><div style="font-weight:700;font-size:14px">${esc(r.short||r.name)}${r.swapReason?' <span class="badge y">troca</span>':''}</div><div class="small muted">${fmtShort(r.date)} · ${r.durationMin} min · RPE ${r.rpe||'–'}${r.summaryLine?' · '+esc(r.summaryLine):''}</div></div><div class="num muted small">${sessionLoad(r)}</div></div>`).join('')}</div>`;
  h+=`</div>`;
  $('#scr-progresso').innerHTML=h;
}

async function exportJSON(withShots){
  const src=withShots?S:Object.assign({},S,{shots:{}});
  const data=JSON.stringify(src,null,1);const filename='tennis-os-backup-'+today()+(withShots?'-com-prints':'')+'.json';
  // Publicada, a página só entrega ficheiros pelo canal do visualizador; solta, usa o download normal.
  let dl=null;
  if(typeof claude!=='undefined'&&claude&&typeof claude.use==='function'){try{dl=await claude.use('downloads')}catch(e){}}
  if(dl){try{const r=await dl.save({filename,data});toast(r&&r.status==='delivered'?'Ficheiro entregue':'Exportado: '+filename)}
    catch(e){toast(e&&e.code==='cancelled'?'Exportação cancelada':'Não deu para exportar. Usa "Copiar JSON".',3000)}
    return}
  try{const blob=new Blob([data],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},1500);toast('Exportado: '+filename)}
  catch(e){toast('Não deu para descarregar. Usa "Copiar JSON".',3000)}
}
function importJSONText(txt){
  let obj;try{obj=JSON.parse(txt)}catch(e){toast('JSON inválido',3000);return false}
  if(!obj||typeof obj!=='object'||!Array.isArray(obj.sessions)||typeof obj.health!=='object'){toast('Isto não é um backup do Tennis OS',3000);return false}
  pergunta('Importar este backup?',`${obj.sessions.length} sessões e ${Object.keys(obj.health).length} check-ins. Substitui os dados atuais deste dispositivo.`,'Importar',()=>{
    const prev=S.rev||0;
    S=migrate(obj);
    S.rev=Math.max(S.rev||0,prev); // fica acima do que está no servidor, senão o sync desfazia a importação
    saveNow();applyTheme();render();toast('Importado com sucesso');
  });
  return true;
}
function applyTheme(){document.documentElement.dataset.theme=S.settings.theme==='light'?'light':'dark';const m=$('meta[name=theme-color]');if(m)m.content=S.settings.theme==='light'?'#EEF1F5':'#0B0E11'}

// Confirmações dentro da app, e não com confirm()/prompt() do browser: publicada, a app corre numa
// iframe com sandbox sem "allow-modals", onde confirm() devolve false sem sequer mostrar nada — ou
// seja, o botão não fazia nada e não havia forma de perceber porquê.
let PERGUNTA=null;
function pergunta(titulo,texto,rotulo,fn,perigo){

  sheet(`<h2>${esc(titulo)}</h2>${texto?`<div class="small muted mt4">${esc(texto)}</div>`:''}

}

// ============================== IMPORTAÇÃO: APPLE HEALTH / CSV ==============================
// Um HTML estático não lê a app Saúde em direto. Aceita o export.xml (ou o export.zip) e extrai,
// no browser, FC em repouso, sono e treinos. Leitura por blocos (4 MB) para não bloquear o iPhone.
function importStatus(msg){const el=$('#import-status');if(el)el.innerHTML=msg;}
const CHUNK=4*1024*1024;
function toLocalDate(s){ // "2026-09-01 07:12:00 +0100" | ISO | "Sep 1, 2026, 7:12:00 AM"
  if(!s)return null;const m=String(s).match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return m[1]+'-'+m[2]+'-'+m[3];
  const dm=String(s).match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})/);if(dm){const a=+dm[1],b=+dm[2];const mmdd=b>12&&a<=12;return dm[3]+'-'+pad(mmdd?a:b)+'-'+pad(mmdd?b:a)} // PT: dia/mês/ano por defeito
  const t=Date.parse(s);return isNaN(t)?null:isoOf(new Date(t));
}
function parseAttrs(str){const o={};str.replace(/([\w:]+)="([^"]*)"/g,(_,k,v)=>{o[k]=v});return o}
// Acumulador de registos do Apple Health
function healthAcc(){
  return {rhr:{},sleep:{},steps:{},workouts:[],n:0,
    feed(text){
      const re=/<(Record|Workout)\s([^>]*?)\/?>/g;let m;
      while((m=re.exec(text))){this.n++;const a=parseAttrs(m[2]);
        if(m[1]==='Record'){
          if(a.type==='HKQuantityTypeIdentifierRestingHeartRate'){const d=toLocalDate(a.startDate);const v=parseFloat(a.value);if(d&&v>25&&v<150)(this.rhr[d]=this.rhr[d]||[]).push(v)}
          else if(a.type==='HKQuantityTypeIdentifierStepCount'){const d=toLocalDate(a.startDate);const v=parseFloat(a.value);if(d&&v>0){const s=this.steps[d]=this.steps[d]||{};const k=a.sourceName||'?';s[k]=(s[k]||0)+v}}
          else if(a.type==='HKCategoryTypeIdentifierSleepAnalysis'){if(/InBed|Awake/.test(a.value||''))continue;const t0=Date.parse(a.startDate.replace(' ','T').replace(/ ([+-]\d{4})$/,'$1')),t1=Date.parse(a.endDate.replace(' ','T').replace(/ ([+-]\d{4})$/,'$1'));if(isNaN(t0)||isNaN(t1))continue;const day=isoOf(new Date(t1));/* noite atribuída ao dia em que acorda */const key=(a.sourceName||'?');const s=this.sleep[day]=this.sleep[day]||{};s[key]=(s[key]||0)+(t1-t0)/3600000}
        }else{const d=toLocalDate(a.startDate);if(!d)continue;const type=(a.workoutActivityType||'').replace('HKWorkoutActivityType','');let min=parseFloat(a.duration);if(a.durationUnit==='sec')min/=60;if(a.durationUnit==='hr')min*=60;if(!isFinite(min)||min<3)continue;this.workouts.push({date:d,type,min:Math.round(min),src:'Apple Health'})}
      }
    },
    result(){
      const daily={};
      for(const [d,vs] of Object.entries(this.rhr))daily[d]=Object.assign(daily[d]||{},{rhr:Math.round(median(vs))});
      for(const [d,bySrc] of Object.entries(this.sleep)){const h=Math.max(...Object.values(bySrc));if(h>=1&&h<=16)daily[d]=Object.assign(daily[d]||{},{sleepH:Math.round(h*10)/10})}
      // iPhone e relógio contam os mesmos passos: usar a fonte com mais, nunca somar
      for(const [d,bySrc] of Object.entries(this.steps)){const n=Math.round(Math.max(...Object.values(bySrc)));if(n>0&&n<200000)daily[d]=Object.assign(daily[d]||{},{steps:n})}
      return {daily,workouts:this.workouts};
    }};
}
// Lê um Blob por blocos, evitando cortar tags a meio
async function scanBlobChunks(blob,acc,onProgress){
  const dec=new TextDecoder();let carry='';
  for(let off=0;off<blob.size;off+=CHUNK){
    const buf=await blob.slice(off,Math.min(blob.size,off+CHUNK)).arrayBuffer();
    let text=carry+dec.decode(buf,{stream:true});const cut=text.lastIndexOf('<');
    if(cut>text.length-4000&&off+CHUNK<blob.size){carry=text.slice(cut);text=text.slice(0,cut)}else carry='';
    acc.feed(text);onProgress(Math.min(1,(off+CHUNK)/blob.size));await new Promise(r=>setTimeout(r,0));
  }
  if(carry)acc.feed(carry);
}
async function scanStreamChunks(stream,acc,onProgress,total){
  const reader=stream.getReader();const dec=new TextDecoder();let carry='',read=0;
  for(;;){const {done,value}=await reader.read();if(done)break;read+=value.byteLength;
    let text=carry+dec.decode(value,{stream:true});const cut=text.lastIndexOf('<');
    if(cut>text.length-4000){carry=text.slice(cut);text=text.slice(0,cut)}else carry='';
    acc.feed(text);onProgress(total?Math.min(1,read/total):null);}
  if(carry)acc.feed(carry);
}
// ZIP: localiza export.xml pelo diretório central e descomprime com DecompressionStream (nativo)
async function zipEntryStream(file){
  const tailSize=Math.min(file.size,66000);const tail=new DataView(await file.slice(file.size-tailSize).arrayBuffer());
  let eocd=-1;for(let i=tail.byteLength-22;i>=0;i--){if(tail.getUint32(i,true)===0x06054b50){eocd=i;break}}
  if(eocd<0)throw new Error('ZIP inválido (sem diretório central)');
  const cdSize=tail.getUint32(eocd+12,true),cdOff=tail.getUint32(eocd+16,true);
  if(cdOff===0xFFFFFFFF)throw new Error('ZIP64 não suportado: extrai o zip e importa o export.xml');
  const cd=new DataView(await file.slice(cdOff,cdOff+cdSize).arrayBuffer());
  let p=0,found=null;
  while(p+46<=cd.byteLength&&cd.getUint32(p,true)===0x02014b50){
    const method=cd.getUint16(p+10,true),csize=cd.getUint32(p+20,true),usize=cd.getUint32(p+24,true),nlen=cd.getUint16(p+28,true),elen=cd.getUint16(p+30,true),clen=cd.getUint16(p+32,true),loff=cd.getUint32(p+42,true);
    const name=new TextDecoder().decode(new Uint8Array(cd.buffer,cd.byteOffset+p+46,nlen));
    if(/(^|\/)export\.xml$/i.test(name)){found={method,csize,usize,loff,name};break}
    p+=46+nlen+elen+clen;
  }
  if(!found)throw new Error('Não encontrei export.xml dentro do zip');
  if(found.csize===0xFFFFFFFF)throw new Error('ZIP64 não suportado: extrai o zip e importa o export.xml');
  const lh=new DataView(await file.slice(found.loff,found.loff+30).arrayBuffer());
  if(lh.getUint32(0,true)!==0x04034b50)throw new Error('Cabeçalho ZIP inválido');
  const dataStart=found.loff+30+lh.getUint16(26,true)+lh.getUint16(28,true);
  const data=file.slice(dataStart,dataStart+found.csize);
  if(found.method===0)return {blob:data,size:found.usize};
  if(found.method!==8)throw new Error('Método de compressão não suportado');
  if(typeof DecompressionStream==='undefined')throw new Error('Este browser não descomprime zip: extrai o zip e importa o export.xml');
  return {stream:data.stream().pipeThrough(new DecompressionStream('deflate-raw')),size:found.usize};
}
async function importHealthFile(file){
  const acc=healthAcc();const t0=Date.now();
  const prog=p=>importStatus(`A ler ${esc(file.name)}… ${p==null?'':Math.round(p*100)+'%'} · ${acc.n.toLocaleString('pt-PT')} registos lidos`);
  try{
    importStatus('A abrir '+esc(file.name)+'…');
    if(/\.zip$/i.test(file.name)){const e=await zipEntryStream(file);if(e.blob)await scanBlobChunks(e.blob,acc,prog);else await scanStreamChunks(e.stream,acc,prog,e.size)}
    else await scanBlobChunks(file,acc,prog);
    const r=acc.result();applyImport(r,'Apple Health');
    const nd=Object.keys(r.daily).length;
    S.ui.importMsg=`<span class="g">Importado</span> em ${((Date.now()-t0)/1000).toFixed(1)} s: ${nd} dias com FC/sono, ${r.workouts.length} treinos, ${acc.n.toLocaleString('pt-PT')} registos lidos.`;
    S.ext.imports.push({when:new Date().toISOString(),source:'Apple Health',summary:nd+' dias, '+r.workouts.length+' treinos'});save();render();
  }catch(e){console.warn(e);importStatus('<span class="r">Falhou:</span> '+esc(e.message))}
}
function applyImport(r,src){
  S.ext.daily=S.ext.daily||{};
  for(const [d,v] of Object.entries(r.daily))S.ext.daily[d]=Object.assign(S.ext.daily[d]||{},v,{src});
  const seen=new Set(S.ext.workouts.map(w=>w.date+'|'+w.type+'|'+w.min));
  for(const w of r.workouts){const k=w.date+'|'+w.type+'|'+w.min;if(!seen.has(k)){seen.add(k);S.ext.workouts.push(w)}}
  S.ext.workouts.sort((a,b)=>a.date<b.date?-1:1);if(S.ext.workouts.length>400)S.ext.workouts=S.ext.workouts.slice(-400);
}
// CSV genérico (Garmin Connect / Strava): deteta colunas pelo nome
function parseCSV(text){
  const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cell+='"';i++}else q=false}else cell+=c}
    else if(c==='"')q=true;else if(c===','||c===';'){row.push(cell);cell=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);cell='';if(row.some(x=>x!==''))rows.push(row);row=[]}else cell+=c}
  if(cell!==''||row.length){row.push(cell);if(row.some(x=>x!==''))rows.push(row)}
  return rows;
}
function parseDurationMin(v){if(v==null||v==='')return null;const s=String(v).trim();const hm=s.match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?$/);if(hm)return hm[3]!=null?(+hm[1]*60+ +hm[2]+ +hm[3]/60):(+hm[1]*60+ +hm[2]);const hmin=s.match(/(\d+)\s*h(?:\s*(\d+)\s*m)?/i);if(hmin)return +hmin[1]*60+(+hmin[2]||0);const n=parseFloat(s.replace(',','.'));if(!isFinite(n))return null;return n>1000?n/60:n}
function parseSleepHours(v){const m=parseDurationMin(v);if(m==null)return null;let h=m;if(m>24)h=m/60;if(h>=0&&h<=16)return Math.round(h*10)/10;return null}
async function importCSVFile(file){
  try{
    importStatus('A ler '+esc(file.name)+'…');
    const text=await file.text();const rows=parseCSV(text);if(rows.length<2)throw new Error('CSV sem linhas');
    const head=rows[0].map(h=>h.trim().toLowerCase());
    const find=(...res)=>{for(const re of res){const i=head.findIndex(h=>re.test(h));if(i>=0)return i}return -1};
    const iDate=find(/^(activity )?date$/,/date|data|dia|start/);
    const iRhr=find(/resting.*(hr|heart)|rhr|fc.*repouso|repouso/);
    const iSleep=find(/sleep.*(dur|time|hours|total)|^sleep$|sono/);
    const iSteps=find(/^steps$|total steps|step count|passos/);
    const iScore=find(/sleep.*score|score.*sono|pontua/);
    const iSlpHr=find(/(sleep|sono).*(hr|heart|card)|(hr|heart).*(sleep|sono)/);
    const iType=find(/activity type|^type$|tipo|sport/);
    const iDur=find(/^(elapsed time|moving time|duration|time|tempo|duração)/);const durSecs=iDur>=0&&/elapsed|moving/.test(head[iDur]); // Strava exporta segundos
    const iHr=find(/avg.*(hr|heart)|average heart|fc m[ée]dia|média/);
    const iName=find(/activity name|title|nome|name/);
    if(iDate<0)throw new Error('Não encontrei coluna de data. Cabeçalho: '+head.slice(0,8).join(', '));
    const daily={},workouts=[];
    for(const r of rows.slice(1)){const d=toLocalDate(r[iDate]);if(!d)continue;
      if(iRhr>=0){const v=parseFloat(r[iRhr]);if(v>25&&v<150)daily[d]=Object.assign(daily[d]||{},{rhr:Math.round(v)})}
      if(iSleep>=0){const h=parseSleepHours(r[iSleep]);if(h!=null)daily[d]=Object.assign(daily[d]||{},{sleepH:h})}
      if(iSteps>=0){const n=num(String(r[iSteps]).replace(/[.\s]/g,'').replace(',','.'));if(n>0&&n<200000)daily[d]=Object.assign(daily[d]||{},{steps:Math.round(n)})}
      if(iScore>=0){const n=parseFloat(String(r[iScore]).replace(',','.'));if(n>0&&n<=100)daily[d]=Object.assign(daily[d]||{},{sleepScore:Math.round(n)})}
      if(iSlpHr>=0){const n=parseFloat(String(r[iSlpHr]).replace(',','.'));if(n>25&&n<150)daily[d]=Object.assign(daily[d]||{},{sleepHr:Math.round(n)})}
      if(iType>=0||iName>=0){const type=(iType>=0?r[iType]:'')||(iName>=0?r[iName]:'')||'treino';let min=iDur>=0?parseDurationMin(r[iDur]):null;if(durSecs&&min!=null&&/^\d+(\.\d+)?$/.test(String(r[iDur]).trim()))min=parseFloat(r[iDur])/60;if(min&&min>=3){const w={date:d,type:type.trim(),min:Math.round(min),src:/strava/i.test(file.name)?'Strava':'Garmin/CSV'};if(iHr>=0){const hr=parseFloat(r[iHr]);if(hr>40&&hr<230)w.hr=Math.round(hr)}workouts.push(w)}}
    }
    const src=/strava/i.test(file.name)?'Strava':'Garmin/CSV';applyImport({daily,workouts},src);
    const nd=Object.keys(daily).length;if(!nd&&!workouts.length)throw new Error('Nada reconhecido. Colunas: '+head.slice(0,10).join(', '));
    S.ui.importMsg=`<span class="g">Importado</span>: ${nd} dias com FC/sono, ${workouts.length} treinos (${rows.length-1} linhas).`;
    S.ext.imports.push({when:new Date().toISOString(),source:src,summary:nd+' dias, '+workouts.length+' treinos'});save();render();
  }catch(e){console.warn(e);importStatus('<span class="r">Falhou:</span> '+esc(e.message))}
}

// ============================== LEITURA DOS PRINTS (OCR) ==============================
// Moldes dos dígitos 0-9 tirados dos prints reais da app do relógio, normalizados a 12x16
// com cobertura 0-9 por célula. Sem bibliotecas: é reconhecimento por comparação de moldes.
const DIG_W=12,DIG_H=16,DIG_MAXD=DIG_W*DIG_H*9;

// Binariza (claro sobre escuro) e devolve componentes ligados
function ocrComponents(bin,W,H){
  const lab=new Int32Array(W*H).fill(-1),st=new Int32Array(W*H),comps=[];
  for(let j=0;j<W*H;j++){
    if(!bin[j]||lab[j]>=0)continue;
    let sp=0;st[sp++]=j;lab[j]=comps.length;
    let x0=j%W,x1=x0,y0=(j/W)|0,y1=y0,n=0;
    while(sp>0){const k=st[--sp],x=k%W,y=(k/W)|0;n++;
      if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;
      if(x>0&&bin[k-1]&&lab[k-1]<0){lab[k-1]=comps.length;st[sp++]=k-1}
      if(x<W-1&&bin[k+1]&&lab[k+1]<0){lab[k+1]=comps.length;st[sp++]=k+1}
      if(y>0&&bin[k-W]&&lab[k-W]<0){lab[k-W]=comps.length;st[sp++]=k-W}
      if(y<H-1&&bin[k+W]&&lab[k+W]<0){lab[k+W]=comps.length;st[sp++]=k+W}
    }
    comps.push({x:x0,y:y0,w:x1-x0+1,h:y1-y0+1,n});
  }
  return comps;
}
function ocrNorm(bin,W,bx,by,bw,bh){
  let s='';
  for(let gy=0;gy<DIG_H;gy++)for(let gx=0;gx<DIG_W;gx++){
    const sx0=bx+Math.floor(gx*bw/DIG_W),sx1=Math.max(bx+Math.floor((gx+1)*bw/DIG_W),sx0+1);
    const sy0=by+Math.floor(gy*bh/DIG_H),sy1=Math.max(by+Math.floor((gy+1)*bh/DIG_H),sy0+1);
    let on=0,tot=0;
    for(let y=sy0;y<sy1;y++)for(let x=sx0;x<sx1;x++){tot++;if(bin[y*W+x])on++}
    s+=Math.min(9,Math.round(9*on/Math.max(1,tot)));
  }
  return s;
}
function ocrClassify(g){
  let b1=1e9,b2=1e9,pick=null;
  for(const d in DIGITS){let s=0;const t=DIGITS[d];
    for(let i=0;i<t.length;i++)s+=Math.abs(+g[i]-+t[i]);
    if(s<b1){b2=b1;b1=s;pick=d}else if(s<b2)b2=s;}
  return {d:pick,dist:b1,margin:b2-b1};
}
// Um componente demasiado largo são dígitos colados: parte nos mínimos da projeção vertical
function ocrSplit(bin,W,c){
  const k=Math.round(c.w/(c.h*0.62));
  if(k<2||k>4)return [c];
  const col=new Int32Array(c.w);
  for(let x=0;x<c.w;x++){let n=0;for(let y=0;y<c.h;y++)if(bin[(c.y+y)*W+c.x+x])n++;col[x]=n}
  const cuts=[];
  for(let i=1;i<k;i++){
    const t=Math.round(i*c.w/k);const lo=Math.max(1,t-Math.round(c.w/(k*3))),hi=Math.min(c.w-2,t+Math.round(c.w/(k*3)));
    let best=t,bv=1e9;for(let x=lo;x<=hi;x++)if(col[x]<bv){bv=col[x];best=x}
    cuts.push(best);
  }
  const parts=[];let prev=0;
  for(const cut of cuts.concat([c.w])){
    const w=cut-prev;if(w<3){prev=cut;continue}
    let y0=c.h,y1=0;
    for(let y=0;y<c.h;y++)for(let x=prev;x<cut;x++)if(bin[(c.y+y)*W+c.x+x]){if(y<y0)y0=y;if(y>y1)y1=y;break}
    if(y1<y0){prev=cut;continue}
    parts.push({x:c.x+prev,y:c.y+y0,w,h:y1-y0+1,n:0});
    prev=cut;
  }
  return parts.length>=2?parts:[c];
}
// Lê todos os números da imagem. Devolve [{v,x,y,w,h,gh}] ordenados por posição.
function ocrImage(cv){
  const cx=cv.getContext('2d',{willReadFrequently:true});
  const W=cv.width,H=cv.height,d=cx.getImageData(0,0,W,H).data;
  const bin=new Uint8Array(W*H);
  for(let i=0,j=0;i<d.length;i+=4,j++)bin[j]=(d[i]*0.299+d[i+1]*0.587+d[i+2]*0.114)>150?1:0;
  const hMin=Math.max(10,H*0.012),hMax=H*0.09;
  let cand=[];
  for(const c of ocrComponents(bin,W,H)){
    if(c.h<hMin||c.h>hMax||c.w<3)continue;
    if(c.w>c.h*1.6)continue;
    if(c.n<c.w*c.h*0.10)continue;
    for(const q of (c.w>c.h*0.95?ocrSplit(bin,W,c):[c])){
      if(q.h<hMin||q.w<3||q.w>q.h*1.05)continue;
      const r=ocrClassify(ocrNorm(bin,W,q.x,q.y,q.w,q.h));
      // só aceita leituras nítidas: perto do molde e longe do segundo melhor
      if(r.dist<DIG_MAXD*0.30&&r.margin>DIG_MAXD*0.045)cand.push({d:r.d,x:q.x,y:q.y,w:q.w,h:q.h});
    }
  }
  cand=cand.filter(g=>g.y+g.h/2>H*0.045); // fora a barra de estado do telemóvel
  // Agrupa por linha ANTES de ordenar por x: dígitos da mesma linha diferem 1-2px no centro,
  // e ordenar só por y baralha-os.
  cand.sort((a,b)=>(a.y+a.h/2)-(b.y+b.h/2));
  const lines=[];
  for(const g of cand){
    const cy=g.y+g.h/2;
    const L=lines.find(l=>Math.abs(l.cy-cy)<Math.max(l.h,g.h)*0.45&&Math.abs(l.h-g.h)<Math.max(l.h,g.h)*0.4);
    if(L){L.items.push(g);L.cy=(L.cy*(L.items.length-1)+cy)/L.items.length;L.h=Math.max(L.h,g.h)}
    else lines.push({cy,h:g.h,items:[g]});
  }
  const runs=[];
  for(const L of lines){
    L.items.sort((a,b)=>a.x-b.x);
    let cur=null;
    for(const g of L.items){
      if(cur&&g.x-(cur.x+cur.w)<cur.h*0.45&&Math.abs(cur.h-g.h)<cur.h*0.3){cur.s+=g.d;cur.w=g.x+g.w-cur.x}
      else{cur={s:g.d,x:g.x,y:g.y,w:g.w,h:g.h};runs.push(cur)}
    }
  }
  runs.sort((a,b)=>(a.y+a.h/2)-(b.y+b.h/2)||a.x-b.x);
  return runs.filter(r=>r.s.length<=4).map(r=>({v:+r.s,n:r.s.length,x:r.x,y:r.y,w:r.w,h:r.h}));
}
// Aplica as regras de leitura dos dois ecrãs do relógio
// Que ecrã é este print? Sem isto, um print de treino era lido como se fosse de sono: o ritmo
// 6'33" tem exatamente a forma de uma duração (6 h 33 min) e ia parar às horas de sono.
// Na dúvida não inventa: devolve o tipo e só se aplicam as regras desse tipo.
function shotKind(runs,W,H){
  const cima=runs.filter(r=>r.y+r.h/2<H*0.5);
  for(const a of cima)for(const b of cima){
    if(a===b)continue;
    if(!(a.x+a.w<W*0.5&&b.x>W*0.5))continue;                       // um em cada metade
    if(Math.abs((a.y+a.h/2)-(b.y+b.h/2))>Math.max(a.h,b.h)*0.6)continue; // mesma linha
    if(a.n===3&&b.n===3&&a.v>=90&&a.v<=220&&b.v>=90&&b.v<=220&&b.v>=a.v)return 'treino'; // FC média + máxima
    if(a.v>=35&&a.v<=110&&b.v>=35&&b.v<=110)return 'fc';           // FC repouso + FC no sono
  }
  return 'sono';
}
function readShot(runs,W,H){
  const out={};
  const rows=[];
  for(const r of runs.slice().sort((a,b)=>a.y-b.y||a.x-b.x)){
    const L=rows.find(l=>Math.abs(l.y-(r.y+r.h/2))<r.h*0.6);
    if(L){L.items.push(r)}else rows.push({y:r.y+r.h/2,items:[r]});
  }
  for(const L of rows)L.items.sort((a,b)=>a.x-b.x);
  out.kind=shotKind(runs,W,H);
  if(out.kind==='treino'){ // ecrã de um treino: FC média e FC máxima
    for(const L of rows){
      if(L.items.length!==2)continue;
      const [a,b]=L.items;
      if(a.n!==3||b.n!==3||a.v<90||a.v>220||b.v<90||b.v>220||b.v<a.v)continue;
      if(!(a.x+a.w<W*0.5&&b.x>W*0.5))continue;
      out.hrAvg=a.v;out.hrMax=b.v;break;
    }
    return out;
  }
  // FC: primeira linha com exatamente 2 números plausíveis, um em cada metade
  for(const L of rows){
    if(L.items.length!==2)continue;
    const [a,b]=L.items;
    if(a.v<35||a.v>110||b.v<35||b.v>110)continue;
    if(!(a.x+a.w<W*0.5&&b.x>W*0.5))continue;
    out.rhr=a.v;out.sleepHr=b.v;break;
  }
  // Sono: pontuação = número no anel. Metade direita, terço de cima, e dígitos nitidamente
  // maiores que o resto da zona (é isso que a distingue de qualquer outro número).
  const top=runs.filter(r=>r.y+r.h/2<H*0.45);
  if(top.length){
    const hs=top.map(r=>r.h).sort((a,b)=>a-b),med=hs[hs.length>>1];
    const cs=top.filter(r=>r.v>=1&&r.v<=100&&r.n<=3&&r.x>W*0.5&&r.h>med*1.15).sort((a,b)=>b.h-a.h);
    if(cs.length)out.sleepScore=cs[0].v;
  }
  // Sono: duração = par (h,min) na mesma linha, separados por texto. Prefere os dígitos maiores.
  let dur=null;
  for(const L of rows)for(let i=0;i+1<L.items.length;i++){
    const a=L.items[i],b=L.items[i+1];
    const gap=b.x-(a.x+a.w);
    if(a.v>14||b.v>59||b.n!==2)continue;
    if(gap<a.h*0.45||gap>a.h*2.6)continue;
    if(!dur||a.h>dur.h)dur={h:a.h,hh:a.v,mm:b.v};
  }
  if(dur){out.sleepHH=dur.hh;out.sleepMM=dur.mm}
  return out;
}

function stick(p,acc={}){
  let s=`<g${p.op?` opacity="${p.op}"`:''}>`;
  s+=`<circle cx="${p.head[0]}" cy="${p.head[1]}" r="4"/>`;
  s+=_p(_seg(p.sh,p.hip),acc.torso?AC:null);
  (p.legs||[]).forEach((l,i)=>s+=_p(_seg(p.hip,l[0])+_seg(l[0],l[1]),acc.legs&&acc.legs.includes(i)?AC:null));
  (p.arms||[]).forEach((a,i)=>s+=_p(_seg(p.sh,a[0])+_seg(a[0],a[1]),acc.arms&&acc.arms.includes(i)?AC:null));

}
