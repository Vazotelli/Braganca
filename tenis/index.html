<title>Tennis Training OS</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0B0E11;--card:#151A1F;--card2:#1C2229;--card3:#232B34;
  --line:rgba(232,237,242,.08);--line2:rgba(232,237,242,.16);
  --text:#E8EDF2;--muted:#8B97A5;--dim:#5A6572;
  --green:#00D68F;--yellow:#FFC94D;--orange:#FF8A3D;--red:#FF5A5F;--blue:#3DA5FF;
  --green-bg:rgba(0,214,143,.14);--yellow-bg:rgba(255,201,77,.14);--orange-bg:rgba(255,138,61,.14);--red-bg:rgba(255,90,95,.14);--blue-bg:rgba(61,165,255,.14);
  --bar:rgba(11,14,17,.86);--on-accent:#06261B;
  --r:14px;--tab-h:62px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Inter,Roboto,Arial,sans-serif;
}
[data-theme=light]{--bg:#EEF1F5;--card:#FFFFFF;--card2:#F3F5F8;--card3:#E7EBF0;--line:rgba(11,14,17,.08);--line2:rgba(11,14,17,.16);--text:#0B0E11;--muted:#4F5B68;--dim:#8B97A5;--bar:rgba(238,241,245,.88)}
html{background:var(--bg);-webkit-text-size-adjust:100%;height:100%;scroll-padding-top:72px;scroll-padding-bottom:calc(var(--tab-h) + env(safe-area-inset-bottom) + 16px)}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100%;-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.35;overscroll-behavior-y:none;touch-action:manipulation}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
input,textarea,select{font-size:16px}
#app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:calc(var(--tab-h) + env(safe-area-inset-bottom) + 28px)}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum","lnum"}
.muted{color:var(--muted)}.dim{color:var(--dim)}.small{font-size:12px}.xs{font-size:11px}
.g{color:var(--green)}.y{color:var(--yellow)}.o{color:var(--orange)}.r{color:var(--red)}.b{color:var(--blue)}
.bg-g{background:var(--green-bg)}.bg-y{background:var(--yellow-bg)}.bg-o{background:var(--orange-bg)}.bg-r{background:var(--red-bg)}.bg-b{background:var(--blue-bg)}
.hide{display:none!important}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.col{display:flex;flex-direction:column}.grow{flex:1;min-width:0}
.center{text-align:center}.right{text-align:right}
.mt4{margin-top:4px}.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}

/* top bar */
.topbar{position:sticky;top:0;z-index:40;background:var(--bar);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.topbar .eyebrow{font-size:11px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.topbar .title{font-size:19px;font-weight:700;letter-spacing:-.3px;line-height:1.15}
.iconbtn{width:44px;height:44px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);background:var(--card)}
.iconbtn:active{background:var(--card2)}
.iconbtn svg{width:22px;height:22px}

/* tab bar */
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;height:calc(var(--tab-h) + env(safe-area-inset-bottom));background:var(--bar);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);border-top:1px solid var(--line);display:flex;padding:6px 0 env(safe-area-inset-bottom);z-index:40}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--dim);font-size:10.5px;font-weight:600;letter-spacing:.2px;min-height:44px}
.tab svg{width:24px;height:24px}
.tab.active{color:var(--green)}

/* screens */
.screen{display:none;padding:14px 0 8px}
.screen.on{display:block;animation:fadeUp .22s cubic-bezier(.22,1,.36,1)}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* Sem transform: um ascendente com transform passa a ser o bloco de referência dos position:fixed
   que tem dentro. Usada onde há barras fixas por baixo (a de "Terminar sessão"), senão durante a
   animação a barra descola do fundo do ecrã e fica por cima da lista a apanhar os toques. */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.sec{padding:0 16px;margin:18px 0 8px;font-size:12px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.sec:first-child{margin-top:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:0 16px 10px}
.card.tight{padding:10px 12px}
.card.flat{background:transparent;border-style:dashed}
.card h3{font-size:16px;font-weight:700;letter-spacing:-.2px}
.card h4{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.kpi{font-size:34px;font-weight:700;letter-spacing:-1px;line-height:1}
.kpi.md{font-size:26px}.kpi.sm{font-size:20px;letter-spacing:-.4px}
.unit{font-size:13px;font-weight:600;color:var(--muted);margin-left:2px;letter-spacing:0}
.label{font-size:12px;color:var(--muted);font-weight:600}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.3px;background:var(--card2);color:var(--muted);white-space:nowrap}
.badge.g{background:var(--green-bg);color:var(--green)}.badge.y{background:var(--yellow-bg);color:var(--yellow)}.badge.r{background:var(--red-bg);color:var(--red)}.badge.b{background:var(--blue-bg);color:var(--blue)}.badge.o{background:var(--orange-bg);color:var(--orange)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.sync-dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--dim);transition:background .3s}
.sync-dot.ok{background:var(--green)}
.sync-dot.guardar,.sync-dot.ligar{background:var(--yellow);animation:blink 1s ease-in-out infinite}
.sync-dot.erro{background:var(--red)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}

/* buttons */
.btn{min-height:50px;width:100%;border-radius:13px;font-weight:700;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line2);background:var(--card2);color:var(--text);padding:0 16px;letter-spacing:-.1px;transition:transform .08s}
.btn:active{transform:scale(.985)}
.btn.primary{background:var(--green);color:var(--on-accent);border-color:transparent}
.btn.blue{background:var(--blue);color:#04203A;border-color:transparent}
.btn.warn{background:var(--yellow);color:#2E2200;border-color:transparent}
.btn.danger{background:var(--red-bg);color:var(--red);border-color:transparent}
.btn.ghost{background:transparent}
.btn.sm{min-height:44px;font-size:14px;width:auto;padding:0 14px;border-radius:11px}
.btn.xs{min-height:36px;font-size:13px;width:auto;padding:0 12px;border-radius:10px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn-row{display:flex;gap:10px}.btn-row .btn{flex:1}

/* forms */
.field{margin-top:12px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px;letter-spacing:.3px}
.input,textarea.input{width:100%;min-height:48px;background:var(--card2);border:1px solid var(--line2);border-radius:12px;padding:10px 12px;color:var(--text);outline:none;-webkit-appearance:none;appearance:none}
.input:focus{border-color:var(--blue)}
textarea.input{min-height:74px;resize:vertical;line-height:1.4}
input[type=date].input{color-scheme:dark}
[data-theme=light] input[type=date].input{color-scheme:light}
.seg{display:flex;gap:6px}
.seg button{flex:1;min-height:44px;border-radius:11px;background:var(--card2);border:1px solid var(--line);font-weight:700;font-size:15px;color:var(--muted)}
.seg button.on{background:var(--blue-bg);border-color:var(--blue);color:var(--blue)}
.seg.g button.on{background:var(--green-bg);border-color:var(--green);color:var(--green)}
.seg.scale button{font-size:14px;padding:0 4px}
.seg button small{display:block;font-size:10px;font-weight:600;opacity:.8;margin-top:1px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:38px;padding:0 13px;border-radius:999px;background:var(--card2);border:1px solid var(--line);font-weight:600;font-size:14px;color:var(--muted);display:inline-flex;align-items:center}
.chip.on{background:var(--blue-bg);border-color:var(--blue);color:var(--blue)}
.stepper{display:inline-flex;align-items:center;gap:4px}
.stepper button{width:44px;height:44px;border-radius:11px;background:var(--card2);border:1px solid var(--line2);font-size:22px;font-weight:600;line-height:1;color:var(--text)}
.stepper button:active{background:var(--card3)}
.stepper .val{min-width:46px;text-align:center;font-size:22px;font-weight:700;letter-spacing:-.5px}
.stepper.sm button{width:38px;height:38px;font-size:18px}.stepper.sm .val{min-width:36px;font-size:18px}
.stepper.xs{gap:2px}.stepper.xs button{width:34px;height:40px;font-size:18px;border-radius:9px}.stepper.xs .val{min-width:30px;font-size:17px}
.rpe-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.rpe-grid button{min-height:52px;border-radius:11px;background:var(--card2);border:1px solid var(--line);font-weight:800;font-size:17px;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.rpe-grid button small{font-size:9px;font-weight:600;letter-spacing:.1px}
.rpe-grid button.on{color:var(--text);border-color:var(--text);background:var(--card3)}
.rpe-grid button.on.g{border-color:var(--green);color:var(--green)}.rpe-grid button.on.y{border-color:var(--yellow);color:var(--yellow)}.rpe-grid button.on.r{border-color:var(--red);color:var(--red)}
.opt{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;background:var(--card2);border:1px solid var(--line);margin-top:8px;min-height:56px}
.opt:active{background:var(--card3)}
.opt .ico{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none;font-size:18px}
.opt b{display:block;font-size:15px}.opt span{font-size:12.5px;color:var(--muted)}
.fs-elapsed{font-size:13px;font-weight:700;color:var(--muted);padding:6px 10px;border-radius:9px;background:var(--card)}
.ghost-hint{font-size:11px;color:var(--dim);margin-top:2px}
.sub{font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
.numrow{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);min-height:56px}
.numrow:last-of-type{border-bottom:0}
.numrow .nl{font-size:15px;font-weight:600}
.numrow .nh{font-size:11.5px;color:var(--dim);margin-top:1px;line-height:1.25}
.numrow .nin{width:82px;min-height:46px;text-align:center;font-size:19px;font-weight:700;padding:6px 4px;flex:none}
.numrow .nu{font-size:12px;font-weight:700;color:var(--muted);width:34px;flex:none}
.chip.pain.p1{background:var(--yellow-bg);border-color:var(--yellow);color:var(--yellow)}
.chip.pain.p2{background:var(--red-bg);border-color:var(--red);color:var(--red)}
.shots{display:flex;gap:8px;flex-wrap:wrap}
.shot{position:relative;width:72px;height:104px;border-radius:10px;overflow:hidden;background:var(--card2);border:1px solid var(--line2);flex:none}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
.shot-x{position:absolute;top:2px;right:2px;width:26px;height:26px;border-radius:50%;background:rgba(11,14,17,.8);color:var(--text);display:flex;align-items:center;justify-content:center}
.shot-x svg{width:14px;height:14px}
.shot.add{display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--muted);border-style:dashed;cursor:pointer}
.shot-full{position:fixed;inset:0;z-index:120;background:rgba(0,0,0,.94);display:flex;align-items:center;justify-content:center;padding:16px}
.shot-full img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}
input[type=range]{width:100%;-webkit-appearance:none;appearance:none;height:44px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:var(--card3)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:var(--text);margin-top:-11px;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.toggle{width:52px;height:32px;border-radius:16px;background:var(--card3);position:relative;flex:none;border:1px solid var(--line2)}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--muted);transition:transform .18s,background .18s}
.toggle.on{background:var(--green-bg);border-color:var(--green)}.toggle.on::after{transform:translateX(20px);background:var(--green)}
.check{width:28px;height:28px;border-radius:8px;border:2px solid var(--line2);display:inline-flex;align-items:center;justify-content:center;flex:none}
.check.on{background:var(--green);border-color:var(--green);color:var(--on-accent)}
.checkbtn{width:48px;height:48px;display:flex;align-items:center;justify-content:center;flex:none;border-radius:12px}
.checkbtn:active{background:var(--card2)}

/* rings */
.ring{position:relative;display:inline-block;flex:none}
.ring svg{display:block;transform:rotate(-90deg)}
.ring .fg{transition:stroke-dashoffset .9s cubic-bezier(.22,1,.36,1)}
.ring .txt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1}
.ring .txt .v{font-weight:700;letter-spacing:-1px}
.ring .txt .l{font-size:10px;color:var(--muted);font-weight:700;letter-spacing:.4px;text-transform:uppercase;margin-top:4px}

/* bars */
.bars{display:flex;flex-direction:column;gap:7px}
.bar{display:flex;align-items:center;gap:10px;font-size:12px}
.bar .d{width:30px;color:var(--muted);font-weight:700}
.bar .track{flex:1;height:14px;background:var(--card2);border-radius:5px;position:relative;overflow:hidden}
.bar .plan{position:absolute;left:0;top:0;bottom:0;background:var(--card3);border-radius:5px}
.bar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--blue);transition:width .8s cubic-bezier(.22,1,.36,1)}
.bar .v{width:46px;text-align:right;color:var(--muted);font-weight:600}
.bar.today .d{color:var(--text)}

/* alerts */
.alert{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border-radius:12px;margin:0 16px 8px;font-size:13.5px;line-height:1.35;border:1px solid transparent}
.alert .ic{flex:none;width:22px;height:22px;display:flex;align-items:center;justify-content:center;margin-top:1px}
.alert b{display:block;font-size:13.5px;margin-bottom:1px}
.alert.r{background:var(--red-bg);border-color:rgba(255,90,95,.25)}.alert.r .ic,.alert.r b{color:var(--red)}
.alert.y{background:var(--yellow-bg);border-color:rgba(255,201,77,.25)}.alert.y .ic,.alert.y b{color:var(--yellow)}
.alert.b{background:var(--blue-bg);border-color:rgba(61,165,255,.25)}.alert.b .ic,.alert.b b{color:var(--blue)}
.alert.g{background:var(--green-bg);border-color:rgba(0,214,143,.25)}.alert.g .ic,.alert.g b{color:var(--green)}
.alert.o{background:var(--orange-bg);border-color:rgba(255,138,61,.25)}.alert.o .ic,.alert.o b{color:var(--orange)}

/* calendar strip */
.weekstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:0 16px 10px}
.day{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 2px 7px;text-align:center;min-height:74px;display:flex;flex-direction:column;align-items:center;gap:4px}
.day.sel{border-color:var(--blue)}
.day.today .dn{color:var(--green)}
.day .dn{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.3px}
.day .dd{font-size:15px;font-weight:700}
.day .st{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
.st.done{background:var(--green);color:var(--on-accent)}.st.swapped{background:var(--yellow);color:#2E2200}.st.missed{background:var(--red-bg);color:var(--red)}.st.rest{background:var(--card2);color:var(--dim)}.st.today{border:2px solid var(--green);color:var(--green)}.st.upcoming{border:1.5px solid var(--line2);color:var(--dim)}.st.moved{background:var(--blue-bg);color:var(--blue)}
.day .sk{font-size:9.5px;color:var(--dim);font-weight:700;letter-spacing:.2px}

/* phases */
.phase{border-left:3px solid var(--line2);padding-left:12px;margin-left:2px}
.phase.on{border-left-color:var(--green)}
.phase.past{opacity:.6}
.plist{display:flex;flex-direction:column;gap:10px}
.pbar{height:6px;border-radius:3px;background:var(--card2);overflow:hidden;position:relative}
.pbar>i{position:absolute;left:0;top:0;bottom:0;background:var(--green);border-radius:3px;transition:width .8s cubic-bezier(.22,1,.36,1)}

/* lists */
.list{display:flex;flex-direction:column}
.list .item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);min-height:52px}
.list .item:last-child{border-bottom:0}
.list .item.tap:active{opacity:.7}

/* sheets & overlays */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:80;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .15s}
/* 90dvh (e não 90vh) porque no Safari do iPhone vh conta com as barras escondidas: a folha ficava
   mais alta que o ecrã visível e o botão principal caía por baixo da área tocável. */
.sheet{position:relative;background:var(--card);border-radius:22px 22px 0 0;width:100%;max-width:480px;max-height:90vh;max-height:90dvh;overflow:auto;padding:12px 16px 0;animation:slideUp .25s cubic-bezier(.22,1,.36,1);-webkit-overflow-scrolling:touch}
.sheet>*:last-child:not(.sheet-foot){margin-bottom:calc(18px + env(safe-area-inset-bottom))}
/* Rodapé colado ao fundo da folha: a ação principal fica sempre à vista, mesmo com a folha a rolar. */
.sheet-foot{position:sticky;bottom:0;margin:16px -16px 0;padding:12px 16px calc(14px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line);z-index:2}
.sheet-foot>*+*{margin-top:8px}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line2);margin:0 auto 12px}
.sheet-x{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;background:var(--card2);color:var(--muted);display:flex;align-items:center;justify-content:center;z-index:1}
.sheet-x svg{width:16px;height:16px}
.sheet h2{font-size:20px;font-weight:800;letter-spacing:-.3px;margin-bottom:4px}
/* scroll-padding: ao abrir um exercício a app faz scrollIntoView; sem isto o cabeçalho do exercício
   ia parar por baixo da barra fixa de cima (ou da de baixo) e parecia que o toque não tinha feito nada. */
.fullscreen{position:fixed;inset:0;z-index:70;background:var(--bg);overflow:auto;-webkit-overflow-scrolling:touch;animation:fadeIn .22s cubic-bezier(.22,1,.36,1);scroll-padding-top:calc(70px + env(safe-area-inset-top));scroll-padding-bottom:calc(100px + env(safe-area-inset-bottom))}
/* folga por baixo maior que a barra de "Terminar sessão" (≈77px + área segura), senão o último
   exercício da lista fica por baixo dela e não há mais scroll para o tirar de lá. */
.fullscreen .inner{max-width:480px;margin:0 auto;padding-bottom:calc(150px + env(safe-area-inset-bottom))}
.fs-bar{position:sticky;top:0;z-index:5;background:var(--bar);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.fs-bar .title{font-weight:800;font-size:16px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fs-foot{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;padding:10px 16px calc(12px + env(safe-area-inset-bottom));background:var(--bar);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);z-index:6}
#toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom) + 18px);transform:translateX(-50%) translateY(20px);background:var(--card3);color:var(--text);padding:11px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:200;opacity:0;pointer-events:none;transition:all .25s;max-width:92%;text-align:center;border:1px solid var(--line2);box-shadow:0 8px 30px rgba(0,0,0,.45)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* exercises (session) */
.ex{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin:0 16px 10px;overflow:hidden}
.ex.done{border-color:rgba(0,214,143,.35)}
.ex.blocked{opacity:.55}
.ex-head{display:flex;align-items:center;gap:12px;padding:12px;min-height:64px}
.ex-head .ill{width:88px;height:48px;flex:none;border-radius:10px;background:var(--card2);display:flex;align-items:center;justify-content:center;overflow:hidden;padding:2px}
.ex-head .ill svg{width:100%;height:100%}
.ex-head .ill svg text{display:none}
.ex-head .nm{font-weight:700;font-size:15px;line-height:1.2}
.ex-head .tg{font-size:12.5px;color:var(--muted);margin-top:3px}
.ex-head .chev{color:var(--dim);transition:transform .2s}
.ex.open .ex-head .chev{transform:rotate(180deg)}
.ex-body{display:none;padding:0 12px 14px;border-top:1px solid var(--line)}
.ex.open .ex-body{display:block}
.ill-big{width:100%;aspect-ratio:2/1;background:var(--card2);border-radius:12px;margin:12px 0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.ill-big svg{width:100%;height:100%}
.tip{font-size:13.5px;color:var(--muted);line-height:1.4;margin-top:8px}
.tip b{color:var(--text)}
.tip.err{color:var(--text)}.tip.err b{color:var(--red)}
.tip.note{color:var(--text);background:var(--blue-bg);border-radius:10px;padding:9px 11px;font-size:13px}
.tip.note b{color:var(--blue)}
.setrow{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0}
.setrow .sn{font-size:13px;font-weight:700;color:var(--muted)}
.roundrow{display:grid;grid-template-columns:1fr auto;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.roundrow:last-child{border-bottom:0}
.rr-head{display:flex;justify-content:space-between;align-items:baseline}
.rr-head .rn{font-weight:800;font-size:14px}
.rr-head .rp{font-size:12.5px;color:var(--muted);margin-left:6px}
.rr-pct{font-weight:800;font-size:18px;letter-spacing:-.5px}
.rr-fields{display:flex;gap:10px;justify-content:space-between;margin-top:8px}
.rr-f{flex:1;text-align:center}
.rr-f .label{margin-bottom:4px;font-size:11px}
.block-head{padding:16px 16px 8px;display:flex;justify-content:space-between;align-items:baseline}
.block-head h3{font-size:15px;font-weight:800;letter-spacing:-.2px}
.block-head .m{font-size:12px;color:var(--muted);font-weight:700}
.timer{background:var(--card2);border-radius:14px;padding:14px;text-align:center;margin-top:12px;border:1px solid var(--line)}
.timer .t{font-size:46px;font-weight:800;letter-spacing:-2px;line-height:1}
.timer .st{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-top:6px}
.timer.work{border-color:var(--red);background:var(--red-bg)}.timer.work .st{color:var(--red)}
.timer.rest{border-color:var(--blue);background:var(--blue-bg)}.timer.rest .st{color:var(--blue)}
.timer.done{border-color:var(--green)}
.laps{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.lap{padding:6px 10px;border-radius:9px;background:var(--card);font-weight:700;font-size:14px;border:1px solid var(--line)}
.lap.best{border-color:var(--green);color:var(--green)}
.summary-big{font-size:22px;font-weight:800;letter-spacing:-.5px;line-height:1.2}

/* charts */
.chart{width:100%;overflow:hidden}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);font-weight:600;margin-top:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}
.table{width:100%;border-collapse:collapse;font-size:13px}
.table th{text-align:left;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;padding:6px 4px;border-bottom:1px solid var(--line)}
.table td{padding:8px 4px;border-bottom:1px solid var(--line)}
.table tr:last-child td{border-bottom:0}
.table td.n{text-align:right}
.spark{display:flex;align-items:flex-end;gap:2px;height:28px}
.spark i{flex:1;background:var(--blue);border-radius:2px;min-height:2px;opacity:.85}
.empty{padding:26px 16px;text-align:center;color:var(--muted);font-size:14px;line-height:1.45}
.empty b{color:var(--text)}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div>
      <div class="eyebrow" id="tb-eyebrow">Tennis OS</div>
      <div class="title" id="tb-title">Hoje</div>
    </div>
    <div class="row" style="gap:8px">
      <span class="sync-dot local" id="sync-dot" title="Só neste dispositivo"></span>
      <button class="iconbtn" data-act="open-settings" aria-label="Definições">

<script>
'use strict';
/* =====================================================================
   TENNIS TRAINING OS — ficheiro único, offline, sem dependências.
   Secções: utils · estado · plano · biblioteca · saúde/prontidão ·
            carga · ecrãs · sessão ativa · trocas · gráficos · SVG · import
   ===================================================================== */

// ============================== UTILS ==============================
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const pad=n=>String(n).padStart(2,'0');
const isoOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseISO=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parseISO(s);d.setDate(d.getDate()+n);return isoOf(d)};
const dow=s=>(parseISO(s).getDay()+6)%7; // Seg=0 … Dom=6
const mondayOf=s=>addDays(s,-dow(s));
const diffDays=(a,b)=>Math.round((parseISO(b)-parseISO(a))/864e5);
const DIAS=['Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'];
const DIAS_S=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
const MESES_S=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const fmtDate=s=>{const d=parseISO(s);return DIAS[dow(s)]+', '+d.getDate()+' '+MESES_S[d.getMonth()]};
const fmtShort=s=>{const d=parseISO(s);return d.getDate()+' '+MESES_S[d.getMonth()]};
const fmtMMSS=sec=>{sec=Math.max(0,Math.round(sec));return pad(Math.floor(sec/60))+':'+pad(sec%60)};
const fmtLap=sec=>sec>=60?fmtMMSS(sec):(Math.round(sec*10)/10).toFixed(1)+'s';
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const pct=(a,b)=>b>0?Math.round(100*a/b):0;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const sum=a=>a.reduce((x,y)=>x+(+y||0),0);
const mean=a=>a.length?sum(a)/a.length:0;
const median=a=>{if(!a.length)return null;const s=[...a].sort((x,y)=>x-y);const m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2};
const num=(v,d=0)=>{const n=parseFloat(v);return isFinite(n)?n:d};

// Hooks de desenvolvimento (só via URL): #d=AAAA-MM-DD força a data de "hoje"; #dev-reset apaga os dados.
let TODAY_OVERRIDE=null;
(function(){const m=location.hash.match(/d=(\d{4}-\d{2}-\d{2})/);if(m)TODAY_OVERRIDE=m[1];if(/dev-reset/.test(location.hash)){try{localStorage.removeItem('tennisOS.v1')}catch(e){}}})();
const today=()=>TODAY_OVERRIDE||isoOf(new Date());

let toastT;
function toast(msg,ms=2200){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),ms)}

// ============================== ESTADO ==============================
const KEY='tennisOS.v1';
function defaultState(){return{
  version:1,createdAt:new Date().toISOString(),
  settings:{startDate:mondayOf(today()),weekendDay:'both',weekendV2:true,matchDate:'',theme:'dark',stepGoal:6000,age:0,hrMax:0},
  sessions:[],      // registos de sessões concluídas
  health:{},        // 'AAAA-MM-DD' -> check-in diário
  shots:{},         // 'AAAA-MM-DD' -> prints da app do relógio (reduzidos)
  swaps:[],         // histórico de trocas {date,from,to,reason,detail}
  overrides:{},     // 'AAAA-MM-DD' -> {key,opts,reason,detail} sessão trocada para o dia
  lastLogs:{},      // exId -> último registo (pré-preenchimento)
  ext:{workouts:[],imports:[],daily:{}},  // dados importados (Apple Health / CSV): treinos, histórico de importações, FC/sono por dia
  active:null,      // sessão em curso (rascunho)
  rev:0,            // revisão, para saber qual dispositivo tem o mais recente
  ui:{tab:'hoje',planWeek:null,progEx:null}
}}
let S=loadState();
function loadState(){
  try{const raw=localStorage.getItem(KEY);if(!raw)return defaultState();
    const s=JSON.parse(raw);return migrate(s)}catch(e){console.warn('estado inválido',e);return defaultState()}
}
function migrate(s){const d=defaultState();
  for(const k of Object.keys(d))if(s[k]===undefined)s[k]=d[k];
  s.settings=Object.assign({},d.settings,s.settings||{});
  // Os dois dias de fim de semana passaram a estar disponíveis: aplica uma vez e depois respeita a escolha
  if(!s.settings.weekendV2){s.settings.weekendDay='both';s.settings.weekendV2=true}
  s.ext=Object.assign({workouts:[],imports:[],daily:{}},s.ext||{});
  s.ui=Object.assign({},d.ui,s.ui||{});
  return s}
let saveT;
// persist escreve no telemóvel. saveNow marca uma revisão nova e manda sincronizar.
function persist(){
  try{localStorage.setItem(KEY,JSON.stringify(S));return true}catch(e){
    // Sem espaço: os prints são o que ocupa. Larga os mais antigos e tenta outra vez.
    const days=Object.keys(S.shots||{}).sort();let dropped=0;
    while(days.length){delete S.shots[days.shift()];dropped++;
      try{localStorage.setItem(KEY,JSON.stringify(S));toast('Sem espaço: apaguei os prints de '+dropped+' dia(s) antigo(s)',4000);return true}catch(_){}}
    toast('Sem espaço para guardar. Exporta o JSON e apaga prints.',5000);return false;
  }
}
function save(){clearTimeout(saveT);saveT=setTimeout(saveNow,60)}
function saveNow(){clearTimeout(saveT);S.rev=(S.rev||0)+1;const ok=persist();syncQueue();return ok}
window.addEventListener('pagehide',saveNow);document.addEventListener('visibilitychange',()=>{if(document.hidden)saveNow()});

// ============================== SINCRONIZAÇÃO ==============================
// Os dados vivem no telemóvel (rápido, funciona offline) e, quando a app corre publicada,
// sincronizam com o armazenamento do artefacto, para estarem em qualquer dispositivo.
// Os prints ficam sempre só no dispositivo: são imagens e não vale a pena atravessá-las.
const SYNC_DOC='estado/tenis';
const SYNC={db:null,ready:false,state:'local',at:null,t:null,busy:false,pending:false};
const SYNC_TXT={local:'Só neste dispositivo',ligar:'A ligar…',ok:'Sincronizado',guardar:'A guardar…',erro:'Falhou'};
function syncSet(st){SYNC.state=st;const el=$('#sync-dot');if(el){el.className='sync-dot '+st;el.title=SYNC_TXT[st]||st}
  if(S.ui.tab==='saude'||$('.sheet'))return;}
function syncBody(){
  return {v:1,rev:S.rev||0,at:new Date().toISOString(),
    settings:S.settings,sessions:S.sessions,health:S.health,swaps:S.swaps,
    overrides:S.overrides,lastLogs:S.lastLogs,ext:S.ext};
}
function syncAdopt(b){
  if(b.settings)S.settings=Object.assign({},S.settings,b.settings);
  if(Array.isArray(b.sessions))S.sessions=b.sessions;
  if(Array.isArray(b.swaps))S.swaps=b.swaps;
  for(const k of ['health','overrides','lastLogs','ext'])if(b[k]&&typeof b[k]==='object')S[k]=b[k];
  S=migrate(S);S.rev=b.rev||0;persist(); // persist e não saveNow: adotar não é uma revisão nova
}
function syncQueue(){if(!SYNC.db||!SYNC.ready)return;clearTimeout(SYNC.t);SYNC.t=setTimeout(syncPush,1200)}
async function syncPush(){
  if(!SYNC.db||!SYNC.ready)return;
  if(SYNC.busy){SYNC.pending=true;return}
  SYNC.busy=true;syncSet('guardar');
  try{await SYNC.db.doc(SYNC_DOC).set(syncBody());SYNC.at=Date.now();syncSet('ok')}
  catch(e){console.warn('sync push',e);syncSet('erro')}
  finally{SYNC.busy=false;if(SYNC.pending){SYNC.pending=false;syncQueue()}}
}
async function syncInit(){
  if(typeof claude==='undefined'||!claude||typeof claude.use!=='function'){syncSet('local');return}
  syncSet('ligar');
  let db=null;try{db=await claude.use('db')}catch(e){}
  if(!db){syncSet('local');return}
  SYNC.db=db;
  try{
    const snap=await db.doc(SYNC_DOC).get();
    const b=snap.exists?snap.data():null;
    // Só depois de uma leitura boa é que se pode escrever, senão um dispositivo
    // novo e vazio apagaria o que está no servidor.
    SYNC.ready=true;
    if(b&&(b.rev||0)>(S.rev||0)){syncAdopt(b);render();toast('Dados carregados do servidor')}
    else await syncPush();
    SYNC.at=Date.now();syncSet('ok');
    db.doc(SYNC_DOC).onSnapshot(s=>{
      if(!s.exists)return;const r=s.data();
      if((r.rev||0)>(S.rev||0)){syncAdopt(r);SYNC.at=Date.now();syncSet('ok');render();toast('Atualizado a partir de outro dispositivo',3000)}
    },e=>{console.warn('sync stream',e);syncSet('erro')});
  }catch(e){console.warn('sync init',e);syncSet('erro')}
}
document.addEventListener('visibilitychange',()=>{if(document.hidden){clearTimeout(SYNC.t);syncPush()}});

// ============================== PLANO ==============================
const PLAN_WEEKS=32;
const PHASES=[
  {n:1,from:1,to:8,name:'Reconstrução',focus:'Foco quase total no serviço: lançamento consistente, pronação, terminar do lado oposto, 2.º serviço com efeito.',kpis:['Acertos no alvo a subir semana a semana','Duplas faltas por set abaixo de 3']},
  {n:2,from:9,to:20,name:'Padrões',focus:'Explorar a vantagem de canhoto: slice aberto no lado da vantagem que arrasta o destro para o revés e para fora do campo. Revés com direção.',kpis:['60% de primeiros serviços dentro em jogo','Padrão serviço aberto + direita para o espaço']},
  {n:3,from:21,to:32,name:'Competição',focus:'Mais sets, menos técnica. Força passa de resistência para potência: menos reps, mais intenção.',kpis:['Sets ganhos contra adversários variados','Duplas faltas por set abaixo de 2']}
];
const MATCH_PHASE={n:4,name:'Semana de prova',focus:'Volume técnico cai 40%. Sem força pesada nos 3 dias anteriores. Aulas mantidas.',kpis:['Chegar fresco: prontidão acima de 70 no dia']};

function weekOf(d){return Math.floor(diffDays(S.settings.startDate,d)/7)+1}
function isMatchWeek(d){const m=S.settings.matchDate;return !!m&&mondayOf(m)===mondayOf(d)}
function daysToMatch(d){const m=S.settings.matchDate;return m?diffDays(d,m):null}
function weekInfo(d){
  const w=weekOf(d);const wc=clamp(w,1,PLAN_WEEKS);
  const ph=PHASES.find(p=>wc>=p.from&&wc<=p.to);
  const deload=w>=1&&w%4===0;const match=isMatchWeek(d);
  return {w,wc,ph:match?MATCH_PHASE:ph,basePh:ph,deload,match,beyond:w>PLAN_WEEKS,before:w<1};
}
// Dias de fim de semana disponíveis. 'both' usa sábado e domingo; a força divide-se pelos dois.
function weekendDays(){const w=S.settings.weekendDay;return w==='both'?[5,6]:w==='sun'?[6]:[5]}
const splitWeekend=()=>S.settings.weekendDay==='both';
// Sessão planeada por dia da semana. 'S5' resolve para S5b (ou S5a se houver jogo), 'S6' para S5c.
function plannedKey(d){
  const k=dow(d);
  if(k===0)return 'S1';if(k===1)return 'S2';if(k===2)return 'S3';if(k===3)return null;if(k===4)return 'S4';
  const wd=weekendDays();if(!wd.includes(k))return null;
  return k===wd[0]?'S5':'S6';
}
function sessionsOn(d){return S.sessions.filter(s=>s.date===d)}
function weekendDone(d){ // sessão de fim de semana desta semana já feita?
  const mon=mondayOf(d);const sat=addDays(mon,5),sun=addDays(mon,6);
  return S.sessions.some(s=>(s.date===sat||s.date===sun)&&(['S5','S6'].includes(s.planned)||['S5a','S5b','S5c'].includes(s.key)));
}
// Resolve o que o dia "é": planeado, chave efetiva (com trocas), registos, estado
function resolveDay(d){
  const planned=plannedKey(d);const recs=sessionsOn(d);const ov=S.overrides[d]||null;
  let key=ov?ov.key:(planned==='S5'?'S5b':planned==='S6'?'S5c':planned);
  let optional=false;
  // outro dia do fim de semana: sessão S5 em aberto pode ser feita aqui
  if(!planned&&!ov&&(dow(d)===5||dow(d)===6)&&!weekendDone(d)){key='S5b';optional=true}
  let status;
  const t=today();
  if(recs.length)status=recs.some(r=>r.swapReason)?'swapped':'done';
  else if(!planned&&!ov){status=optional&&d>=t?'optional':'rest'}
  else if(d<t){status=(planned==='S5'&&!splitWeekend()&&weekendDone(d))?'moved':'missed'}
  else if(d===t)status='today';else status='upcoming';
  return {date:d,planned,key,ov,recs,status,optional};
}

// ============================== BIBLIOTECA ==============================
// Tipos de registo: checkbox · tempo · sets_reps · servico · spider · corrida_intervalos · jogo · aula
// seg: segmentos com impacto (para trocas por dor): ombro, cotovelo, joelho, costas
const EX={
  corda:{name:'Corda de saltar',type:'tempo',svg:'corda',seg:['joelho'],desc:'Ritmo leve, saltos baixos (2-3 cm), pés juntos, aterrar na ponta do pé com o calcanhar a roçar o chão.',err:'Saltar alto e aterrar de calcanhar. Isto é aquecimento e progressão de tendão, não é cardio.',rope:true},
  mobilidade:{name:'Rotações de ombro e anca, círculos de braço',type:'checkbox',svg:'mobilidade',desc:'10 rotações de ombro para cada lado, 10 círculos de anca, 10 círculos de braço grandes e lentos.',err:'Fazer depressa. Amplitude total, sem dor.'},
  serv_aq:{name:'8 serviços a 50% de força',type:'checkbox',svg:'servico_alvos',seg:['ombro','cotovelo'],desc:'Só para acordar o ombro. Lançamento, contacto alto, terminar do lado oposto.',err:'Ir logo a 100%. O ombro frio é onde o tendão parte.',serve:true},
  serv_rondas:{name:'Serviço: 8 rondas × 8 bolas',type:'servico',svg:'servico_alvos',seg:['ombro','cotovelo'],rounds:8,serve:true,
    desc:'Serve as 8, vai buscar, repete. A ida a buscar dá ~40 s de pausa, que é o intervalo real entre pontos. Não acelerar.',err:'Servir as 8 bolas em 30 segundos. O ritmo é parte do treino.',
    roundPlan:[
      {n:1,label:'Só lançamento',goal:'Sem bater. A bola cai sempre no mesmo ponto à frente do pé da frente.',target:'Lançamento no ponto = "alvo"'},
      {n:2,label:'50% força',goal:'Pronação e terminar do lado oposto. Alvo: qualquer caixa.',target:'Caixa de serviço'},
      {n:3,label:'50% força',goal:'Pronação e terminar do lado oposto. Alvo: qualquer caixa.',target:'Caixa de serviço'},
      {n:4,label:'Aberto (lado vantagem)',goal:'Slice canhoto que foge para o revés do destro. Alvo: zona exterior da caixa.',target:'Zona aberta, lado vantagem'},
      {n:5,label:'Aberto (lado vantagem)',goal:'Mesmo alvo. Contacto ligeiramente à direita da bola.',target:'Zona aberta, lado vantagem'},
      {n:6,label:'Aberto (lado vantagem)',goal:'Mesmo alvo, agora a 80% de força.',target:'Zona aberta, lado vantagem'},

      {n:8,label:'2.º serviço com efeito',goal:'Alvo largo, alternar lados.',target:'Metade exterior da caixa'}]},
  spider:{name:'Spider drill',type:'spider',svg:'spider',seg:['joelho'],reps:5,rest:90,desc:'8 bolas espalhadas pelos cantos e linhas. Parte do centro, recolhe uma, volta ao centro. Cronómetro por repetição, 90 s de pausa.',err:'Correr em linha reta e travar de calcanhar. Passos pequenos ao chegar à bola, split-step ao voltar ao centro.'},
  splitstep:{name:'Split-step + deslocamento lateral',type:'tempo',svg:'splitstep',seg:['joelho'],sets:4,secs:30,desc:'Salto curto a dois pés, aterrar largo, deslocar lateral 3 passos, split-step, voltar.',err:'Split-step alto. É um salto de 5 cm, no tempo do adversário a bater.'},

  corrida_solta:{name:'Corrida a soltar',type:'tempo',svg:'corrida',seg:['joelho'],min:10,desc:'Ritmo de conversa. Só a subir a temperatura.',err:'Começar já a puxar.'},
  intervalos:{name:'Intervalos 12 × (30 s forte / 60 s a andar)',type:'corrida_intervalos',svg:'intervalos',seg:['joelho'],reps:12,work:30,rest:60,desc:'30 s a 85-90%, 60 s a andar. O ponto de ténis dura 6 a 10 s: intervalos curtos servem o objetivo, corrida contínua longa não.',err:'Fazer os primeiros 4 a sprint total e morrer no 8. Ritmo que consegues repetir 12 vezes.',note:'Intervalos curtos porque o ponto de ténis dura 6 a 10 segundos. Corrida contínua longa não serve o objetivo.'},

// Progressão de força por semana do plano
function strengthNote(w,ph){
  if(ph&&ph.n===3)return {t:'Fase Competição: potência. Menos reps (5-6), mais intenção e velocidade.',reps:6};
  if(w<=4)return {t:'Semanas 1-4: aprender o gesto. Reps base, controlado, sem falhar.'};
  if(w<=8)return {t:'Semanas 5-8: subir para 12 reps por série.',reps:12};
  if(w<=16)return {t:'Semanas 9-16: descida controlada de 3 s em cada rep.'};
  return {t:'Semana 17+: pausa de 2 s na posição baixa.'};
}
// Corda: 4 min na semana 1, +1 min por semana (teto 12). Agressiva para o Aquiles.
function ropeQuota(w){return clamp(4+(clamp(w,1,99)-1),4,12)}
function ropeSplit(w,deload){const q=ropeQuota(w)*(deload?0.6:1);const s1=Math.min(q,8);return {quota:Math.round(q*10)/10,s1:Math.round(s1*10)/10,s5:Math.round((q-s1)*10)/10}}
const scaleN=(n,f)=>Math.max(1,Math.round(n*f));

// Constrói a sessão concreta para um dia: escalas, bloqueios, notas da semana
// opts: {factor, short, painSegs:[...], key}
function buildSession(key,d,opts={}){
  const def=SESSIONS[key];if(!def)return null;
  const wi=weekInfo(d);const w=clamp(wi.w,1,99);
  let factor=opts.factor||1;
  const flags=[];
  if(def.physical&&wi.deload){factor=Math.min(factor,0.6);flags.push({k:'deload',t:'Semana de descarga: volume a 60%'})}
  if(def.physical&&wi.match&&!wi.deload){factor=Math.min(factor,0.6);flags.push({k:'match',t:'Semana de prova: volume técnico a 60%'})}
  if(opts.factor&&opts.factor<1)flags.push({k:'reduced',t:'Volume a '+Math.round(opts.factor*100)+'%'});
  if(opts.short)flags.push({k:'short',t:'Versão curta: só blocos prioritários'});
  const dtm=daysToMatch(d);const noHeavy=dtm!==null&&dtm>=1&&dtm<=3;
  if(noHeavy&&def.blocks.some(b=>b.strength))flags.push({k:'nostrength',t:'Faltam '+dtm+' dias para a prova: sem força pesada'});
  const pain=painBlock(d);
  const painSegs=opts.painSegs||[];
  const serveBlocked=pain.active||!!opts.blockServe;
  const blockWhy=pain.active?'Dor no '+pain.seg+' ≥2 há '+pain.days+' dias':'Dor declarada no '+(painSegs.join('/')||'ombro/cotovelo');
  if(serveBlocked&&def.blocks.some(b=>b.serve||b.ex.some(e=>EX[e].serve)))flags.push({k:'serveblock',t:'Serviço bloqueado: '+blockWhy.toLowerCase()});
  const sn=strengthNote(w,wi.basePh);
  const rope=ropeSplit(w,wi.deload);
  const blocks=[];
  for(const b of def.blocks){
    if(opts.short&&!b.priority)continue;
    if(noHeavy&&b.strength)continue;
    const bl={id:b.id,name:b.name,min:Math.round(b.min*(def.physical?factor:1)),note:b.note,serve:!!b.serve,blocked:false,ex:[]};
    if(b.serve&&serveBlocked){bl.blocked=true;bl.blockReason=blockWhy+'. Bloco de serviço bloqueado até a dor baixar para 0-1.';}
    for(const id of b.ex){
      const e=EX[id];
      // Com os dois dias de fim de semana a força divide-se: pernas no dia 1, potência e core no dia 2.
      if(splitWeekend()&&key==='S5b'&&['deadbug','agach_salto','skater'].includes(id))continue;
      if(e.seg&&e.seg.some(s=>painSegs.includes(s)))continue;
      if(e.serve&&serveBlocked&&!b.serve)continue;
      const x={id,name:e.name,type:e.type,svg:e.svg,desc:e.desc,err:e.err,note:e.note};
      if(e.type==='sets_reps'){x.sets=scaleN(e.sets,factor);x.reps=e.reps;x.repsN=e.repsN||(typeof e.reps==='number'?e.reps:10);x.unit=e.unit||'reps';x.perSide=!!e.perSide;
        if(e.prog&&sn.reps&&!e.power&&e.unit!=='s')x.repsN=sn.reps,x.reps=sn.reps;
        if(e.prog||e.power)x.prog=e.power&&wi.basePh&&wi.basePh.n===3?'Potência: intenção máxima em cada rep, pausa completa entre reps.':(e.prog?sn.t:null);}
      if(e.type==='tempo'){x.sets=e.sets?scaleN(e.sets,factor):1;x.secs=e.secs||(e.min?Math.round(e.min*60*factor):0);
        if(e.rope){const m=key==='S5b'?rope.s5:rope.s1;x.secs=Math.round(m*60);x.ropeMin=m;x.name='Corda de saltar · '+m+' min (semana '+w+')';}}
      if(e.type==='servico'){x.rounds=scaleN(e.rounds,factor);x.roundPlan=e.roundPlan.slice(0,x.rounds);}
      if(e.type==='spider'){x.reps=scaleN(e.reps,factor);x.rest=e.rest}
      if(e.type==='corrida_intervalos'){x.reps=scaleN(e.reps,factor);x.work=e.work;x.rest=e.rest;x.name=x.reps+' × ('+e.work+' s forte / '+e.rest+' s a andar)'}
      if(e.type==='passos'){x.target=Math.max(500,Math.round((S.settings.stepGoal||e.target)*factor/100)*100);x.mins=Math.round(e.mins*factor)}
      bl.ex.push(x);
    }
    if(!bl.ex.length&&!bl.blocked)continue;
    blocks.push(bl);
  }
  // S5b recebe o resto da quota semanal de corda (o que não cabe no aquecimento de S1)
  if(key==='S5b'&&rope.s5>0&&!opts.short&&!painSegs.includes('joelho')){
    const e=EX.corda;blocks.unshift({id:'corda',name:'Corda (resto da quota semanal)',min:Math.ceil(rope.s5),ex:[{id:'corda',name:'Corda de saltar · '+rope.s5+' min (resto da quota)',type:'tempo',svg:'corda',desc:e.desc,err:e.err,sets:1,secs:Math.round(rope.s5*60),ropeMin:rope.s5}]});
  }
  const est=def.lesson?def.dur:sum(blocks.filter(b=>!b.blocked).map(b=>b.min));
  return {key,name:def.name,short:def.short,focus:def.focus,place:def.place,intensity:def.intensity,lesson:!!def.lesson,match:!!def.match,physical:!!def.physical,est,factor,flags,blocks,week:w,rope,opts};
}
// A sessão efetiva de um dia (com a troca registada, se houver)
function sessionForDay(d){
  const r=resolveDay(d);if(!r.key)return null;
  return buildSession(r.key,d,r.ov?Object.assign({},r.ov.opts||{}):{});
}

// ============================== SAÚDE / PRONTIDÃO ==============================
const PAIN_SEGS=[['ombro','Ombro'],['cotovelo','Cotovelo'],['joelho','Joelho'],['costas','Costas']];
// Check-in manual (principal) completado com dados importados (FC repouso, sono) quando faltam
function healthFor(d){
  const m=S.health[d],x=S.ext.daily&&S.ext.daily[d];if(!m&&!x)return null;
  const h=Object.assign({},m||{});
  if(x){if(h.rhr==null&&x.rhr)h.rhr=x.rhr,h.rhrSrc=x.src;if(h.sleepH==null&&x.sleepH!=null)h.sleepH=x.sleepH,h.sleepSrc=x.src;
    if(h.sleepScore==null&&x.sleepScore)h.sleepScore=x.sleepScore;if(h.sleepHr==null&&x.sleepHr)h.sleepHr=x.sleepHr;
    if(x.steps)h.steps=x.steps;if(!m)h.imported=true}
  return h;
}
// Mediana dos últimos 28 dias para um campo (exclui o próprio dia); mínimo 3 valores
function baselineOf(d,key){
  const vals=[];for(let i=1;i<=28;i++){const h=healthFor(addDays(d,-i));if(h&&h[key])vals.push(h[key])}
  return vals.length>=3?median(vals):null;
}
const rhrBaseline=d=>baselineOf(d,'rhr');
// Pontuação por desvio acima da mediana: igual ou abaixo é o melhor sinal
function vsBaseline(v,b,max){if(b==null)return {score:max*0.75,txt:'sem baseline ainda (neutro)'};const dl=v-b;
  return {score:dl<=0?max:dl<=2?max*0.75:dl<=5?max*0.4:0,txt:'vs mediana '+Math.round(b)+' ('+(dl>0?'+':'')+Math.round(dl)+')'}}
const STATE_OPTS=[[1,'Rebentado'],[2,'Assim-assim'],[3,'Bem']];
const BANDS=[{min:80,c:'g',name:'Verde',rec:'Sessão completa. Podes forçar.'},{min:60,c:'y',name:'Amarelo',rec:'Sessão completa, mas sem subir carga.'},{min:40,c:'o',name:'Laranja',rec:'Versão a 60% do volume.'},{min:0,c:'r',name:'Vermelho',rec:'Descanso ou só mobilidade.'}];
const bandOf=score=>BANDS.find(b=>score>=b.min);
function readiness(d){
  const h=healthFor(d);if(!h)return null;
  const parts=[];
  const add=(k,label,score,max,detail)=>parts.push({k,label,score:Math.round(score),max,detail});
  // Sono curto não é penalização linear: abaixo de 6 h a recuperação cai a pique e nada compensa.
  if(h.sleepH!=null&&h.sleepH>0)add('sleepH','Horas de sono',20*Math.pow(clamp((h.sleepH-3)/5,0,1),1.6),20,fmtH(h.sleepH)+' (alvo 8 h)'+(h.sleepSrc?' · '+h.sleepSrc:''));
  if(h.sleepScore)add('sleepScore','Pontuação de sono',clamp(h.sleepScore/85,0,1)*20,20,h.sleepScore+'/100 · do relógio');
  if(h.rhr){const r=vsBaseline(h.rhr,baselineOf(d,'rhr'),20);add('rhr','FC repouso',r.score,20,h.rhr+' bpm '+r.txt+(h.rhrSrc?' · '+h.rhrSrc:''))}
  if(h.sleepHr){const r=vsBaseline(h.sleepHr,baselineOf(d,'sleepHr'),15);add('sleepHr','FC média no sono',r.score,15,h.sleepHr+' bpm '+r.txt)}
  if(!h.imported){const mp=Math.max(0,...PAIN_SEGS.map(([k])=>h.pain&&h.pain[k]||0));
    const where=PAIN_SEGS.filter(([k])=>(h.pain&&h.pain[k]||0)>0).map(([k,l])=>l+((h.pain[k]||0)>=2?' (forte)':'')).join(', ');
    add('pain','Dor',mp===0?15:mp===1?9:0,15,mp===0?'nenhuma':where)}
  if(h.state)add('state','Como estás',(h.state-1)/2*10,10,(STATE_OPTS.find(o=>o[0]===h.state)||[,''])[1]);
  const max=sum(parts.map(p=>p.max));const sc=sum(parts.map(p=>p.score));
  let score=max?Math.round(sc/max*100):0;
  // Teto por noite curta: uma FC boa não compensa dormir 4 horas.
  let cap=null;const sh=h.sleepH;
  if(sh!=null&&sh>0){if(sh<4)cap={v:30,t:'menos de 4 h de sono'};else if(sh<5)cap={v:45,t:'menos de 5 h de sono'};else if(sh<6)cap={v:65,t:'menos de 6 h de sono'}}
  if(cap&&score>cap.v)score=cap.v;else cap=null;
  // Com menos de metade dos fatores não há score fiável: é falta de dados, não é estares mal.
  return {score,parts,cap,band:bandOf(score),partial:max<100,weak:max<50,maxPts:max,imported:!!h.imported};
}
// Regra rígida: dor ombro/cotovelo ≥2 em dois dias (≥48 h) → bloqueia serviço até baixar
function painBlock(d){
  for(const [seg,label] of PAIN_SEGS.slice(0,2)){
    const days=[];for(let i=0;i<=4;i++){const dd=addDays(d,-i);const h=S.health[dd];if(h)days.push({dd,v:h.pain&&h.pain[seg]||0})}
    if(!days.length)continue;
    const latest=days[0];if(latest.v<2)continue;
    const earlier=days.find(x=>x.dd<latest.dd&&x.v>=2&&diffDays(x.dd,latest.dd)>=1);
    if(earlier){const first=[...days].reverse().find(x=>x.v>=2)||earlier;return {active:true,seg:label.toLowerCase(),since:first.dd,days:diffDays(first.dd,d)+1}}
  }
  return {active:false};
}
function isHighSession(s){return s.intensity==='high'||(s.rpe||0)>=8}
function yesterdayHigh(d){return sessionsOn(addDays(d,-1)).find(isHighSession)||null}

// ============================== CARGA ==============================
const sessionLoad=s=>Math.round((s.durationMin||0)*(s.rpe||0));
const loadOn=d=>sum(sessionsOn(d).map(sessionLoad));
function firstSessionDate(){return S.sessions.length?S.sessions.map(s=>s.date).sort()[0]:null}
function acwr(d){
  let a=0,c=0;for(let i=0;i<28;i++){const l=loadOn(addDays(d,-i));c+=l;if(i<7)a+=l}
  const f=firstSessionDate();const daysData=f?diffDays(f,d)+1:0;
  const acute=a/7,chronic=c/28;
  return {acute,chronic,ratio:chronic>0?acute/chronic:null,daysData,calibrated:daysData>=14&&chronic>0};
}
function expectedRpe(key){return {S1:6,S2:6,S3:8,S4:6,S5a:8,S5b:7,S5c:6,RAIN:6,MOB:3,WALK:3}[key]||6}
function plannedWeekMinutes(mon){let m=0;for(let i=0;i<7;i++){const d=addDays(mon,i);const r=resolveDay(d);if(!r.key||r.optional)continue;const s=r.recs.length?null:sessionForDay(d);m+=r.recs.length?sum(r.recs.map(x=>x.durationMin||0)):(s?s.est:0)}return m}
function actualWeekMinutes(mon){let m=0;for(let i=0;i<7;i++)m+=sum(sessionsOn(addDays(mon,i)).map(s=>s.durationMin||0));return m}
function weekLoads(mon){return Array.from({length:7},(_,i)=>{const d=addDays(mon,i);const r=resolveDay(d);const s=(!r.recs.length&&r.key&&!r.optional)?sessionForDay(d):null;return {d,done:loadOn(d),planned:s?s.est*expectedRpe(r.key):0,status:r.status}})}
function ropeDoneThisWeek(d){const mon=mondayOf(d);let secs=0;for(let i=0;i<7;i++)for(const s of sessionsOn(addDays(mon,i)))for(const [id,l] of Object.entries(s.logs||{}))if(id==='corda'&&l&&l.secs)secs+=l.secs;return secs/60}

// Alertas ativos para o dia
function computeAlerts(d){
  const A=[];const wi=weekInfo(d);const sess=sessionForDay(d);
  const pb=painBlock(d);
  if(pb.active)A.push({c:'r',t:'Serviço bloqueado',x:'Dor no '+pb.seg+' ≥2 desde '+fmtShort(pb.since)+' ('+pb.days+' dias). Todos os blocos de serviço ficam fechados até a dor baixar para 0-1 no check-in.'});
  const h=S.health[d];
  if(!h)A.push({c:'b',t:'Sem check-in hoje',x:(S.ext.daily&&S.ext.daily[d]?'Há FC e sono importados, mas falta a dor. ':'')+'30 segundos no separador Saúde para calcular a prontidão.',act:'tab:saude'});
  else{const r=readiness(d);
    if(r&&r.weak)A.push({c:'b',t:'Check-in incompleto',x:'Só '+r.parts.length+' fatores preenchidos. Escreve o sono, a pontuação e as duas FC do relógio para o score valer alguma coisa.',act:'tab:saude'});
    else if(r&&r.score<40)A.push({c:'r',t:'Prontidão '+r.score+': descanso',x:'Hoje só mobilidade. Forçar com este score é onde a lesão aparece.'});
    else if(r&&r.score<60)A.push({c:'o',t:'Prontidão '+r.score+': versão a 60%',x:'Usa "Trocar sessão → Cansado" para cortar o volume.'})}
  const yh=yesterdayHigh(d);
  if(yh&&sess&&sess.intensity==='high')A.push({c:'y',t:'Dois dias seguidos de alta intensidade',x:'Ontem: '+(SESSION_LABEL[yh.key]||yh.key)+(yh.rpe?' (RPE '+yh.rpe+')':'')+'. Hoje é '+sess.short+'. Baixa para 60% ou troca a sessão.'});
  // Semana cheia: com os dois dias de fim de semana só a quinta é de descanso
  let streak=0;for(let i=1;i<=9;i++){if(sessionsOn(addDays(d,-i)).length)streak++;else break}
  if(streak>=5&&sess)A.push({c:'y',t:(streak+1)+'.º dia seguido de treino',x:'A semana está cheia e só a quinta é de descanso. Se a prontidão não estiver verde, troca hoje por caminhada. O corpo adapta-se no descanso, não no treino.'});
  const ac=acwr(d);
  if(ac.calibrated&&ac.ratio!=null){if(ac.ratio>1.3)A.push({c:'y',t:'Rácio de carga '+ac.ratio.toFixed(2)+' (>1.3)',x:'Carga aguda muito acima da crónica: risco de lesão. Não subas volume esta semana.'});else if(ac.ratio<0.8)A.push({c:'y',t:'Rácio de carga '+ac.ratio.toFixed(2)+' (<0.8)',x:'Estás a destreinar. Cumpre as sessões planeadas.'})}
  if(wi.deload&&!wi.beyond)A.push({c:'b',t:'Semana '+wi.w+' é de descarga',x:'Sessões físicas a 60% do volume. Aulas mantidas. Não é fraqueza, é planeamento.'});
  if(wi.match){const dtm=daysToMatch(d);A.push({c:'b',t:'Semana de prova'+(dtm>0?' · faltam '+dtm+' dias':dtm===0?' · é hoje':''),x:'Volume técnico a 60%. Sem força pesada nos 3 dias anteriores.'})}
  const mon=mondayOf(d);const last=actualWeekMinutes(addDays(mon,-7));const plan=plannedWeekMinutes(mon);
  if(last>0&&plan>last*1.1){const cut=Math.round(plan-last*1.1);A.push({c:'y',t:'Plano da semana +'+Math.round((plan/last-1)*100)+'% vs semana passada',x:'Semana passada: '+last+' min. Plano: '+plan+' min. Limite +10%. Corta ~'+cut+' min: bloco sombra e 2-3 rondas de serviço, ou uma sessão a 60%.'})}
  const rd=ropeDoneThisWeek(d);const rq=ropeSplit(wi.w,wi.deload).quota;
  if(rd>rq+1)A.push({c:'y',t:'Corda acima da quota ('+rd.toFixed(0)+'/'+rq+' min)',x:'Aquiles + piso rápido. Não saltes mais esta semana.'});
  return A;
}

// ============================== RENDER: infra ==============================
const TAB_TITLES={hoje:'Hoje',plano:'Plano',progresso:'Progresso',saude:'Saúde'};
function render(){
  // Sem sessão em curso não pode ficar o ecrã de sessão pendurado: os botões dele iam mexer num
  // S.active que já não existe e rebentavam em silêncio. Acontecia ao apagar os dados ou ao
  // importar um backup com uma sessão a decorrer.
  if(!S.active&&$('#fs').innerHTML)$('#fs').innerHTML='';
  const t=S.ui.tab;
  $$('.screen').forEach(s=>s.classList.toggle('on',s.id==='scr-'+t));
  $$('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));
  const wi=weekInfo(today());
  $('#tb-title').textContent=TAB_TITLES[t]||'Tennis OS';
  $('#tb-eyebrow').textContent=fmtDate(today())+(wi.before?'':' · Sem '+wi.w);
  ({hoje:renderHoje,plano:renderPlano,progresso:renderProgresso,saude:renderSaude})[t]();
  requestAnimationFrame(animateRings);
}
function animateRings(){$$('.ring .fg[data-off]').forEach(c=>{c.style.strokeDashoffset=c.dataset.off});$$('.bar .fill[data-w]').forEach(b=>{b.style.width=b.dataset.w});$$('.pbar>i[data-w]').forEach(b=>{b.style.width=b.dataset.w})}
function ring(v,max,{size=120,stroke=10,color='var(--green)',label='',value=null,sub=''}={}){
  const r=(size-stroke)/2,C=2*Math.PI*r;const p=max>0?clamp(v/max,0,1):0;const off=C*(1-p);
  const vs=value!=null?value:Math.round(v);
  const fs=size>=120?36:size>=90?26:20;
  return `<div class="ring" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--card3)" stroke-width="${stroke}"/><circle class="fg" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}" data-off="${off}"/></svg><div class="txt"><div class="v num" style="font-size:${fs}px">${vs}</div>${label?`<div class="l">${label}</div>`:''}${sub?`<div class="xs muted mt4">${sub}</div>`:''}</div></div>`;
}
const ICON={warn:'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2.5 20h19L12 3z"/><path d="M12 10v4M12 17.5v.5"/></svg>',info:'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8v.5"/></svg>',block:'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M6 6l12 12"/></svg>',chev:'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',check:'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>',left:'<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>',right:'<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',x:'<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>'};
function alertHtml(a){return `<div class="alert ${a.c}" ${a.act?`data-act="alert-act" data-target="${a.act}"`:''}><div class="ic">${a.c==='r'?ICON.block:a.c==='b'?ICON.info:ICON.warn}</div><div><b>${esc(a.t)}</b>${esc(a.x)}</div></div>`}

// ============================== ECRÃ: HOJE ==============================
function renderHoje(){
  const d=today();const wi=weekInfo(d);const day=resolveDay(d);const sess=sessionForDay(d);
  const r=readiness(d);const alerts=computeAlerts(d);
  const mon=mondayOf(d);
  // rings
  const planMin=plannedWeekMinutes(mon),doneMin=actualWeekMinutes(mon);
  let plannedDays=0,doneDays=0;for(let i=0;i<28;i++){const dd=addDays(d,-i);const rr=resolveDay(dd);if(rr.status==='done'||rr.status==='swapped'){doneDays++;plannedDays++}else if(rr.status==='missed')plannedDays++;}
  const adh=plannedDays?Math.round(100*doneDays/plannedDays):0;
  const ac=acwr(d);
  const phaseLine=wi.before?'O plano começa a '+fmtShort(S.settings.startDate):wi.beyond?'Plano de 32 semanas concluído · semana '+wi.w:`Semana ${wi.w} de ${PLAN_WEEKS} · Fase ${wi.ph.n}: ${wi.ph.name}`;
  let h=`<div class="card" style="padding:16px 14px 14px">
    <div class="row between wrap" style="gap:6px">
      <div><div class="label">${esc(fmtDate(d))}</div><div style="font-size:17px;font-weight:800;letter-spacing:-.3px;margin-top:2px">${esc(phaseLine)}</div></div>
      <div class="row" style="gap:6px">${wi.deload?'<span class="badge b">Descarga</span>':''}${wi.match?'<span class="badge y">Prova</span>':''}</div>
    </div>
    <div class="row mt16" style="gap:14px">
      ${r?ring(r.score,100,{size:124,stroke:11,color:`var(--${r.band.c==='o'?'orange':r.band.c==='g'?'green':r.band.c==='y'?'yellow':'red'})`,label:'Prontidão'}):ring(0,100,{size:124,stroke:11,color:'var(--dim)',value:'–',label:'Prontidão'})}
      <div class="grow">
        ${r?`<div class="row" style="gap:6px"><span class="dot" style="background:var(--${r.band.c==='o'?'orange':r.band.c==='g'?'green':r.band.c==='y'?'yellow':'red'})"></span><b>${r.band.name}</b>${r.partial?'<span class="badge">parcial</span>':''}</div><div class="mt4" style="font-size:14px;line-height:1.35">${r.weak?'Faltam números do relógio para isto valer alguma coisa.':esc(r.band.rec)}</div><button class="btn xs ghost mt8" data-act="tab" data-tab="saude">Ver cálculo</button>`
          :`<div style="font-size:14px;line-height:1.35">Sem check-in de hoje. São 30 segundos.</div><button class="btn sm blue mt8" data-act="tab" data-tab="saude">Fazer check-in</button>`}
      </div>
    </div>
  </div>`;
  // mini rings row
  h+=`<div class="card tight"><div class="row" style="justify-content:space-around">
    <div class="center">${ring(doneMin,planMin||1,{size:82,stroke:8,color:'var(--blue)',value:doneMin,label:'min'})}<div class="label mt4">Volume <span class="dim">/${planMin}</span></div></div>
    <div class="center">${ring(adh,100,{size:82,stroke:8,color:adh>=80?'var(--green)':adh>=60?'var(--yellow)':'var(--red)',value:adh+'%',label:'28 d'})}<div class="label mt4">Aderência</div></div>
    <div class="center">${ring(ac.ratio!=null?clamp(ac.ratio,0,2):0,2,{size:82,stroke:8,color:!ac.calibrated?'var(--dim)':ac.ratio>1.3||ac.ratio<0.8?'var(--yellow)':'var(--green)',value:ac.ratio!=null?ac.ratio.toFixed(2):'–',label:'A:C'})}<div class="label mt4">${ac.calibrated?'Rácio carga':'Calibrar '+Math.min(ac.daysData,14)+'/14'}</div></div>
  </div></div>`;
  // session card
  h+=sessionCardHtml(d,day,sess);
  // alerts
  if(alerts.length){h+=`<div class="sec">Alertas ativos <span class="badge">${alerts.length}</span></div>`+alerts.map(alertHtml).join('')}
  // weekly load bars
  const wl=weekLoads(mon);const mx=Math.max(1,...wl.map(x=>Math.max(x.done,x.planned)));
  h+=`<div class="sec">Carga da semana <span class="muted xs" style="text-transform:none;letter-spacing:0;font-weight:600">duração × RPE</span></div><div class="card"><div class="bars">`+wl.map(x=>`<div class="bar ${x.d===d?'today':''}"><div class="d">${DIAS_S[dow(x.d)]}</div><div class="track"><div class="plan" style="width:${pct(x.planned,mx)}%"></div><div class="fill" style="width:0;background:${x.status==='swapped'?'var(--yellow)':x.status==='missed'?'var(--red)':'var(--blue)'}" data-w="${pct(x.done,mx)}%"></div></div><div class="v num">${x.done?x.done:x.planned?'<span class="dim">~'+x.planned+'</span>':'–'}</div></div>`).join('')+`</div>
    <div class="row between mt12 small muted"><span>Aguda ${Math.round(ac.acute)}/dia</span><span>Crónica ${Math.round(ac.chronic)}/dia</span><span>Semana ${sum(wl.map(x=>x.done))}</span></div></div>`;
  $('#scr-hoje').innerHTML=h;
}
function sessionCardHtml(d,day,sess){

  if(day.recs.length){const r=day.recs[day.recs.length-1];
    return `<div class="card" style="border-color:rgba(0,214,143,.35)"><div class="row between"><div class="label">Sessão de hoje ${r.swapReason?'<span class="badge y">trocada</span>':'<span class="badge g">feita</span>'}</div><span class="num muted small">${r.durationMin} min · RPE ${r.rpe||'–'}</span></div><h3 class="mt4">${esc(r.name)}</h3>${r.summaryLine?`<div class="summary-big mt8">${esc(r.summaryLine)}</div>`:''}${r.swapReason?`<div class="small muted mt8">Motivo da troca: ${esc(SWAP_LABEL[r.swapReason]||r.swapReason)}${r.swapDetail?' · '+esc(r.swapDetail):''}</div>`:''}<div class="btn-row mt12"><button class="btn sm" data-act="view-session" data-id="${r.id}">Ver registo</button>${day.recs.length<2?`<button class="btn sm ghost" data-act="start-extra">Sessão extra</button>`:''}</div></div>`}

  const ovLine=day.ov?`<div class="row between mt8" style="gap:8px"><div class="small y grow">Trocada: ${esc(SWAP_LABEL[day.ov.reason]||day.ov.reason)}${day.ov.detail?' · '+esc(day.ov.detail):''}</div>${isToday?`<button class="btn xs ghost" data-act="undo-override" data-d="${d}">Anular</button>`:''}</div>`:'';
  return `<div class="card"><div class="row between"><div class="label">${day.optional?'Sessão de fim de semana em aberto':isToday?'Sessão de hoje':fmtDate(d)}</div><span class="badge">${esc(sess.place)}</span></div>
    <h3 class="mt4" style="font-size:20px">${esc(sess.name)}</h3>
    <div class="row mt8" style="gap:14px"><div><div class="kpi sm num">${sess.est}<span class="unit">min</span></div><div class="label">estimado</div></div><div class="grow"><div style="font-size:14px;font-weight:600">${esc(sess.focus)}</div><div class="label">foco</div></div></div>
    ${flags?`<div class="row wrap mt8" style="gap:6px">${flags}</div>`:''}${ovLine}
    <div class="mt12">${blocks}</div>
    ${isToday?`<div class="btn-row mt12"><button class="btn primary" style="flex:2;min-height:56px;font-size:17px" data-act="start-session">Iniciar</button><button class="btn" data-act="swap-open">Trocar sessão</button></div>`:''}
  </div>`;
}

function renderPlano(){
  const t=today();const mon=S.ui.planWeek||mondayOf(t);const wi=weekInfo(mon);
  const sel=S.ui.planSel&&mondayOf(S.ui.planSel)===mon?S.ui.planSel:(mon===mondayOf(t)?t:mon);
  let h=`<div class="row between" style="padding:0 16px 10px"><button class="iconbtn" data-act="plan-week" data-n="-1">${ICON.left}</button><div class="center"><div style="font-weight:800;font-size:16px">${wi.before?'Antes do plano':wi.beyond?'Semana '+wi.w+' (pós-plano)':'Semana '+wi.w+' de '+PLAN_WEEKS}</div><div class="small muted">${fmtShort(mon)} – ${fmtShort(addDays(mon,6))}${wi.before||wi.beyond?'':' · '+wi.ph.name}${wi.deload?' · <span class="b">descarga</span>':''}</div></div><button class="iconbtn" data-act="plan-week" data-n="1">${ICON.right}</button></div>`;
  h+=`<div class="weekstrip">`+Array.from({length:7},(_,i)=>{const d=addDays(mon,i);const r=resolveDay(d);const st=r.status;

    return `<div class="day ${d===t?'today':''} ${d===sel?'sel':''}" data-act="plan-sel" data-d="${d}"><div class="dn">${DIAS_S[i]}</div><div class="dd num">${parseISO(d).getDate()}</div><div class="st ${st}">${mark}</div><div class="sk">${r.key?esc(SESSION_LABEL[r.key]||r.key).split(' ')[0]:''}</div></div>`}).join('')+`</div>`;
  h+=dayDetailHtml(sel);
  // progress in plan
  const cw=clamp(weekOf(t),0,PLAN_WEEKS);
  h+=`<div class="sec">Fases do plano</div><div class="card"><div class="row between small muted"><span>Progresso</span><span class="num">${cw}/${PLAN_WEEKS} semanas</span></div><div class="pbar mt8"><i style="width:0" data-w="${pct(cw,PLAN_WEEKS)}%"></i></div>
    <div class="plist mt16">`+PHASES.map(p=>{const cur=weekInfo(t);const on=cur.basePh&&cur.basePh.n===p.n&&!cur.before&&!cur.beyond;const past=!cur.before&&cur.wc>p.to;
      return `<div class="phase ${on?'on':''} ${past?'past':''}"><div class="row between"><b>Fase ${p.n}: ${p.name}</b><span class="small muted num">sem ${p.from}-${p.to}</span></div><div class="small mt4" style="line-height:1.4">${esc(p.focus)}</div><div class="mt4">${p.kpis.map(k=>`<div class="small muted">• KPI: ${esc(k)}</div>`).join('')}</div></div>`}).join('')+
    `<div class="phase ${weekInfo(t).match?'on':''}"><div class="row between"><b>Semana de prova</b><span class="small muted">${S.settings.matchDate?fmtShort(S.settings.matchDate):'<span data-act="open-settings" style="text-decoration:underline">definir data</span>'}</span></div><div class="small mt4" style="line-height:1.4">${esc(MATCH_PHASE.focus)}</div></div>
    <div class="small muted mt12">Cada 4.ª semana é de descarga: -40% no volume das sessões físicas, aulas mantidas.</div></div></div>`;
  // swap patterns
  const pat=swapPatterns();
  h+=`<div class="sec">Padrões de troca</div><div class="card">${pat.length?pat.map(p=>`<div class="row between" style="padding:6px 0"><span>${esc(p.t)}</span><span class="badge ${p.n>=p.of/2?'y':''}">${p.n}/${p.of}</span></div>`).join(''):'<div class="small muted">Sem trocas registadas ainda.</div>'}</div>`;
  $('#scr-plano').innerHTML=h;
}
function dayDetailHtml(d){
  const r=resolveDay(d);const sess=r.key?sessionForDay(d):null;const wi=weekInfo(d);

function swapPatterns(){
  const out=[];const t=today();
  for(let k=0;k<7;k++){if(k===3)continue;
    // últimas 8 ocorrências deste dia da semana até hoje
    let d=addDays(t,-((dow(t)-k+7)%7));const occ=[];while(occ.length<8&&d>=S.settings.startDate){occ.push(d);d=addDays(d,-7)}
    if(occ.length<2)continue;
    const n=occ.filter(dd=>S.swaps.some(s=>s.date===dd)).length;
    if(n>0)out.push({t:'Trocaste '+n+' das últimas '+occ.length+' '+DIAS[k].toLowerCase()+'s',n,of:occ.length});
  }
  return out;
}

// ---------- Prints da app do relógio ----------
// Guardados no próprio ficheiro, reduzidos a 560px e JPEG 0.5, para caberem no localStorage.
const SHOT_MAX_W=560,SHOT_Q=0.5,SHOT_KEEP_DAYS=21,SHOT_PER_DAY=4;
// Uma fotografia real da câmara (12+ MP) é muito maior que um print de ecrã (a app foi testada
// com prints ~1.5 MP). Ler pixels a essa resolução (getImageData) é o passo pesado: um canvas do
// tamanho nativo de uma foto de 12 MP chega aos ~190 MB só de buffer, o que trava ou é morto por
// falta de memória num iPhone, em silêncio, sem erro nenhum. A correção: nunca ler pixels acima de
// OCR_MAX_SIDE, seja qual for o tamanho original.
const OCR_MAX_SIDE=1600;
function fitBox(w,h,maxSide){const m=Math.max(w,h);if(m<=maxSide)return {w,h};const s=maxSide/m;return {w:Math.max(1,Math.round(w*s)),h:Math.max(1,Math.round(h*s))}}
function fileToImg(file){ // reserva para quando createImageBitmap não existe ou falha (ex.: formato exótico)
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{const img=new Image();img.onload=()=>res(img);img.onerror=()=>rej(new Error('Não consegui ler a imagem. Tenta outro formato (PNG ou JPEG).'));img.src=fr.result};
    fr.onerror=()=>rej(new Error('Não consegui ler o ficheiro'));
    fr.readAsDataURL(file);
  });
}
async function addShot(d,file){
  if(!/^image\//.test(file.type)){toast('Isso não é uma imagem');return}
  toast('A processar a imagem…',6000);
  const fail=(msg)=>{toast(msg,5000);console.warn('addShot:',msg)};
  let done=false;
  const watchdog=setTimeout(()=>{if(!done)fail('Demorou demasiado a processar. Tenta uma imagem mais pequena (print de ecrã em vez de foto).')},15000);
  try{
    // createImageBitmap decodifica direto do ficheiro, sem passar por uma string base64 (uma foto de
    // câmara em base64 chega a ocupar o dobro em memória) e lida melhor com formatos como HEIC do
    // que um <img>. Em navegadores sem suporte, cai para a reserva por FileReader+Image.
    let bmp=null;
    try{bmp=await createImageBitmap(file)}catch(err){console.warn('createImageBitmap falhou, a usar reserva',err)}
    const src=bmp||await fileToImg(file);
    const iw=bmp?bmp.width:src.width, ih=bmp?bmp.height:src.height;
    done=true;clearTimeout(watchdog);
    // OCR só num canvas limitado: a nitidez para ler dígitos não precisa da resolução nativa.
    let read={};
    try{
      const o=fitBox(iw,ih,OCR_MAX_SIDE);
      const f=document.createElement('canvas');f.width=o.w;f.height=o.h;
      f.getContext('2d',{willReadFrequently:true}).drawImage(src,0,0,o.w,o.h);
      read=readShot(ocrImage(f),o.w,o.h);
    }catch(err){console.warn('OCR falhou',err)}
    // Guardar: reduzido a SHOT_MAX_W. drawImage de uma imagem grande para um canvas pequeno é
    // barato (o browser faz o downscale); o que era caro era o passo de cima, já resolvido.
    const sc=Math.min(1,SHOT_MAX_W/iw);
    const w=Math.max(1,Math.round(iw*sc)),hh=Math.max(1,Math.round(ih*sc));
    const c=document.createElement('canvas');c.width=w;c.height=hh;
    c.getContext('2d').drawImage(src,0,0,w,hh);
    if(bmp)bmp.close();
    let data;try{data=c.toDataURL('image/jpeg',SHOT_Q)}catch(e){fail('Não consegui reduzir a imagem: '+(e&&e.message||e));return}
    S.shots=S.shots||{};const arr=S.shots[d]=S.shots[d]||[];
    if(arr.length>=SHOT_PER_DAY){toast('Máximo de '+SHOT_PER_DAY+' prints por dia');return}
    arr.push({id:uid(),data,w,h:hh,at:new Date().toISOString(),read});
    pruneShots();
    if(!saveNow()){arr.pop();render();return}
    const n=applyRead(d,read);
    render();
    toast(n?'Li '+n+' valor'+(n>1?'es':'')+' do print'
      :read.kind==='treino'?'Isto é o resumo de um treino. Anexa-o em "Terminar sessão" para classificar o esforço.'
      :'Print guardado, mas não reconheci números',read.kind==='treino'?4500:3200);
  }catch(err){
    done=true;clearTimeout(watchdog);
    fail((err&&err.message)||'Falhou a processar a imagem');
  }
}
// Lê o print de resumo de um treino e propõe o RPE. Guarda só os números, não a imagem.
async function rpeFromShot(file){
  if(!/^image\//.test(file.type)){toast('Isso não é uma imagem');return}
  if(!S.active){toast('Não há sessão em curso');return}
  toast('A ler o print…',6000);
  try{
    let bmp=null;
    try{bmp=await createImageBitmap(file)}catch(err){console.warn('createImageBitmap falhou, a usar reserva',err)}
    const src=bmp||await fileToImg(file);
    const iw=bmp?bmp.width:src.width, ih=bmp?bmp.height:src.height;
    const o=fitBox(iw,ih,OCR_MAX_SIDE);
    const c=document.createElement('canvas');c.width=o.w;c.height=o.h;
    c.getContext('2d',{willReadFrequently:true}).drawImage(src,0,0,o.w,o.h);
    const read=readShot(ocrImage(c),o.w,o.h);
    if(bmp)bmp.close();
    if(read.kind!=='treino'||!read.hrAvg){
      toast(read.kind==='sono'||read.kind==='fc'?'Esse é um print do sono/FC em repouso. Preciso do resumo do treino, com a FC média e a máxima.'
        :'Não encontrei a FC média neste print. Escolhe o RPE à mão.',5000);
      return;
    }
    const a=S.active;a.hrAvg=read.hrAvg;a.hrMax=read.hrMax||null;
    const ref=hrMaxRef();
    if(ref){a.rpeAuto=rpeFromHr(read.hrAvg,ref.v);a.rpe=a.rpeAuto}
    save();finishSheet();
    toast(ref?'FC média '+read.hrAvg+' → RPE '+a.rpeAuto:'Li FC média '+read.hrAvg+'. Falta a tua FC máxima para propor o RPE.',4000);
  }catch(err){toast('Não consegui ler o print: '+((err&&err.message)||err),5000)}
}
function pruneShots(){ // os números ficam para sempre; as imagens só os últimos 21 dias
  if(!S.shots)return;const lim=addDays(today(),-SHOT_KEEP_DAYS);

function initLog(e){

    case 'servico':return {rounds:Array.from({length:e.rounds},()=>({s:8,in:null,t:null}))};

function hasData(e,log){

function markExDone(e,log,on){

function isDone(e,log){

    case 'sets_reps':return log.sets.length>0&&log.sets.every(s=>s.done);
    case 'servico':return log.rounds.every(r=>r.in!=null);
